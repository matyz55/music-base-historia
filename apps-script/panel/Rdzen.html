      const s = sv('path', { class: 'sl', d: h ? `M${x},${y(0)}V${y(v) + r}Q${x},${y(v)} ${x + r},${y(v)}H${x + bw - r}Q${x + bw},${y(v)} ${x + bw},${y(v) + r}V${y(0)}Z` : '' });
      if (kolor) s.style.fill = kolor;
      g.append(cel, s);
      if (znaczniki && znaczniki[i]) g.append(sv('circle', { cx: x + bw / 2, cy: 6, r: 4, fill: 'var(--s2)' }));
      dymekWykresu(g, () => { svg.querySelectorAll('g.akt').forEach((x) => x !== g && x.classList.remove('akt')); g.classList.add('akt'); dymek.innerHTML = opis(etykiety[i], v, i); dymek.style.left = Math.min(Math.max(x + bw / 2, 80), szer - 80) + 'px'; dymek.style.top = Math.max(y(v), 30) + 'px'; dymek.style.display = 'block'; },
        () => { g.classList.remove('akt'); dymek.style.display = 'none'; });
      svg.append(g);
      if (i % co === 0) { const t = sv('text', { x: L + i * pas + pas / 2, y: wys - 6, 'text-anchor': 'middle' }); t.textContent = etykiety[i]; os.append(t); }
    });
    box.append(svg, dymek);
  });
}
/** Wykres liniowy wielu serii (wspólna oś Y): serie = [{nazwa, wartosci: [..]}]. */
function linie(box, etykiety, serie, { wys = 200, format = (v) => fmt(v, 1), minY = null, maxY = null, minEtykieta = 56, procenty = false, calkowite = false } = {}) {
  responsywny(box, () => {
    box.replaceChildren();
    const szer = Math.max(240, box.clientWidth), L = 44, B = 22, T = 8, R = 8;
    const wszystkie = serie.flatMap((s) => s.wartosci).filter((v) => v != null && !isNaN(v));
    if (!wszystkie.length) { box.append(el('p', { class: 'stan' }, 'Brak danych do wykresu.')); return; }
    let mn = minY != null ? minY : Math.min(...wszystkie), mx = maxY != null ? maxY : Math.max(...wszystkie);
    if (mx === mn) { mx += 1; mn -= procenty ? 0 : 1; }
    const pad = (mx - mn) * 0.08; if (minY == null) mn -= pad; if (maxY == null) mx += pad;
    const x = (i) => L + (szer - L - R) * (etykiety.length > 1 ? i / (etykiety.length - 1) : 0.5), y = (v) => T + (wys - T - B) * (1 - (v - mn) / (mx - mn));
    const svg = sv('svg', { width: szer, height: wys, viewBox: `0 0 ${szer} ${wys}`, role: 'img', 'aria-label': serie.map((s) => s.nazwa).join(', ') });
    const sg = sv('g', { class: 'siatka-w' }), os = sv('g', { class: 'os' });
    // podziałka: przy osi całkowitej (np. miejsca w rankingu) tylko liczby całkowite, bez powtórzeń
    const podz = [];
    if (calkowite) { const krok = Math.max(1, Math.ceil((mx - mn) / 4)); for (let v = Math.ceil(mn); v <= mx + 1e-9; v += krok) podz.push(v); }
    else for (let k = 0; k <= 4; k++) podz.push(mn + (mx - mn) * k / 4);
    podz.forEach((v) => { sg.append(sv('line', { x1: L, x2: szer - R, y1: y(v), y2: y(v) })); const t = sv('text', { x: L - 6, y: y(v) + 4, 'text-anchor': 'end' }); t.textContent = format(v); os.append(t); });
    const co = Math.max(1, Math.ceil(minEtykieta / ((szer - L) / Math.max(1, etykiety.length))));
    etykiety.forEach((e, i) => { if (i % co === 0) { const t = sv('text', { x: x(i), y: wys - 6, 'text-anchor': 'middle' }); t.textContent = e; os.append(t); } });
    svg.append(sg, os);
    const kSt = serie.every((s) => s.jednostka) ? koloryStacji(serie.map((s) => s.jednostka)) : null;
    if (kSt) serie = serie.map((s, i) => (s.kolor ? s : Object.assign({}, s, { kolor: kSt[i] })));
    serie.forEach((s, si) => {
      let d = '';
      s.wartosci.forEach((v, i) => { if (v == null || isNaN(v)) return; d += (d && s.wartosci[i - 1] != null ? 'L' : 'M') + x(i) + ',' + y(v); });
      const p = sv('path', { d, class: 'linia', stroke: s.kolor || KOLORY[si % KOLORY.length] }); p.style.stroke = s.kolor || KOLORY[si % KOLORY.length]; p.style.fill = 'none'; p.style.strokeWidth = 2;
      svg.append(p);
      (s.punkty || []).forEach((i) => { if (s.wartosci[i] != null) { const c = sv('circle', { cx: x(i), cy: y(s.wartosci[i]), r: 5 }); c.style.fill = 'var(--spadek)'; c.style.stroke = 'var(--karta)'; c.style.strokeWidth = 2; svg.append(c); } });
    });
    const kreska = sv('line', { y1: T, y2: wys - B, stroke: 'currentColor', 'stroke-opacity': .25 }); kreska.style.display = 'none'; svg.append(kreska);
    const dymek = el('div', { class: 'dymek' });
    dymekWykresu(svg, (ev) => {
      const r = svg.getBoundingClientRect(), i = Math.round(((ev.clientX - r.left - L) / (szer - L - R)) * (etykiety.length - 1));
      if (i < 0 || i >= etykiety.length) return;
      kreska.setAttribute('x1', x(i)); kreska.setAttribute('x2', x(i)); kreska.style.display = '';
      dymek.innerHTML = `<b>${etykiety[i]}</b><br>` + serie.map((s, si) => `<span style="color:${s.kolor || KOLORY[si % KOLORY.length]}">■</span> ${s.nazwa}: <b>${s.wartosci[i] == null ? '–' : format(s.wartosci[i])}</b>`).join('<br>');
      dymek.style.left = Math.min(Math.max(x(i), 90), szer - 90) + 'px'; dymek.style.top = '40px'; dymek.style.display = 'block';
    }, () => { kreska.style.display = 'none'; dymek.style.display = 'none'; });
    box.append(svg, dymek);
    if (serie.length > 1) box.append(el('div', { class: 'legenda' }, serie.map((s, si) => el('span', { style: { '--kolor': s.kolor || KOLORY[si % KOLORY.length] } }, s.nazwa))));
  });
}
/** Mapa cieplna dzień tygodnia × godzina: hw = {"tg*24+h": n}. */
function mapaCieplna(hw, opisWartosci = (v) => fmt(v)) {
  const max = Math.max(1e-9, ...Object.values(hw || {}));
  const box = el('div', { class: 'mapa', role: 'img', 'aria-label': 'Dzień tygodnia i godzina' });
  box.append(el('span'));
  for (let h = 0; h < 24; h++) box.append(el('span', { class: 'h' }, h % 3 === 0 ? String(h) : ''));
  for (let d = 0; d < 7; d++) {
    box.append(el('span', { class: 'e' }, DNI[d]));
    for (let h = 0; h < 24; h++) {
      const v = (hw || {})[d * 24 + h] || 0;
      const k = el('span', { class: 'k', title: `${DNI[d]} ${h}:00–${h}:59: ${opisWartosci(v)}` });
      if (v) k.append(el('i', { style: { opacity: (0.12 + 0.88 * v / max).toFixed(3) } }));
      box.append(k);
    }
  }
  // dotknięcie kratki pokazuje jej wartość (na telefonie nie ma podpowiedzi po najechaniu)
  box.addEventListener('click', (e) => { const k = e.target.closest('.k'); if (k && k.title) toast(k.title, 3000); });
  return el('div', {}, box, legendaSkali(0, max, opisWartosci));
}
/** R2: przycisk odsłuchu 30-s fragmentu (iTunes) w wierszu listy; jeden fragment naraz, ponowne dotknięcie zatrzymuje. */
let fragmentAudio = null, fragmentPrzycisk = null;
function przyciskFragmentu(x) {
  const b = el('button', { class: 'ikona-btn fragment-btn', title: 'Posłuchaj 30 s', 'aria-label': 'Posłuchaj fragmentu: ' + x.a + ' – ' + x.t, html: svgIkona(IK.graj, 'width="14" height="14"') });
  b.addEventListener('click', (e) => {
    e.stopPropagation();
    if (fragmentPrzycisk === b && fragmentAudio && !fragmentAudio.paused) { fragmentAudio.pause(); b.innerHTML = svgIkona(IK.graj, 'width="14" height="14"'); return; }
    if (fragmentAudio) { fragmentAudio.pause(); if (fragmentPrzycisk) fragmentPrzycisk.innerHTML = svgIkona(IK.graj, 'width="14" height="14"'); }
    b.disabled = true;
    Odsluch.znajdzFragment({ a: x.a, t: x.t }).then((f) => {
      b.disabled = false;
      if (!f || !f.url) { toast('Brak fragmentu tego utworu w iTunes'); return; }
      fragmentAudio = fragmentAudio || new Audio();
      fragmentAudio.src = f.url; fragmentAudio.play().catch(() => toast('Nie udało się odtworzyć fragmentu'));
      fragmentPrzycisk = b; b.innerHTML = svgIkona(IK.pauza, 'width="14" height="14"');
      fragmentAudio.onended = () => { b.innerHTML = svgIkona(IK.graj, 'width="14" height="14"'); };
    }).catch(() => { b.disabled = false; toast('Brak fragmentu'); });
  });
  return b;
}
/** M9: przyklejony pasek skrótów do sekcji (kart) widoku – dotknięcie przewija do karty o danym tytule. */
function spisSekcji(box, pozycje) {
  const pasek = el('div', { class: 'zakladki zakladki-profilu', role: 'navigation', 'aria-label': 'Sekcje' },

/** Komunikat zamiast pustego wykresu, gdy analiza czeka na metadane (B8). */

/** Legenda skali koloru: „mniej → więcej” z wartościami skrajnymi (U1). */
function legendaSkali(min, max, format = (v) => fmt(v), kolor = 'var(--s1)') {
  return el('div', { class: 'legenda-skali' }, el('span', {}, format(min)),
    el('span', { class: 'skala' }, [0.12, 0.34, 0.56, 0.78, 1].map((o) => el('i', { style: { background: kolor, opacity: o } }))),
    el('span', {}, format(max)), el('span', { class: 'sub' }, '· dotknij kratki, by zobaczyć wartość'));

/** Mini wykres (sparkline) liczb. */
function iskierka(wartosci, szer = 110, wys = 26) {
  const svg = sv('svg', { width: szer, height: wys, viewBox: `0 0 ${szer} ${wys}` });
  const mx = Math.max(1, ...wartosci), n = wartosci.length;
  const pkt = wartosci.map((v, i) => `${n > 1 ? (i / (n - 1)) * (szer - 2) + 1 : szer / 2},${wys - 2 - (v / mx) * (wys - 4)}`);
  const p = sv('polyline', { points: pkt.join(' ') }); p.style.fill = 'none'; p.style.stroke = 'var(--s1)'; p.style.strokeWidth = 1.8;
  svg.append(p);
  return svg;
}

// ---------------- wyszukiwarka w nagłówku ----------------
(function () {
  const pole = $('#szukaj-glob'), lista = $('#podpowiedzi');
  let t, ostatnie = [], akt = -1;
  const pokaz = (pozycje) => {
    ostatnie = pozycje; akt = -1;
    lista.replaceChildren(...pozycje.map((p, i) => el('button', { onclick: () => wybierz(i) }, p.ikona, el('span', {}, p.tekst), el('span', { class: 'sub' }, p.sub || ''))));
    lista.hidden = !pozycje.length;
  };
  const wybierz = (i) => { const p = ostatnie[i]; if (!p) return; lista.hidden = true; pole.value = ''; p.akcja(); };
  pole.addEventListener('input', () => {
    clearTimeout(t);
    const q = pole.value.trim();
    if (q.length < 2) { lista.hidden = true; return; }
    const ql = q.toLowerCase();
    const stacje = (S.start ? S.start.jednostki : []).filter((j) => j.nazwa.toLowerCase().includes(ql)).slice(0, 4)
      .map((j) => ({ ikona: logo(j.id, 'm'), tekst: j.nazwa, sub: 'stacja', akcja: () => idz('stacja', j.id) }));
    pokaz(stacje);
    t = setTimeout(() => serwerP('szukaj', q).then((r) => {
      if (pole.value.trim() !== q) return;
      pokaz(stacje.concat(r.wyniki.slice(0, 8).map((x) => ({ ikona: el('span', { style: { width: '22px' } }, '♪'), tekst: x.a + ' – ' + x.t, sub: fmt(x.n) + ' emisji', akcja: () => idz('utwor', x.k) })),
        [{ ikona: el('span', { style: { width: '22px' } }, '⌕'), tekst: 'Wszystkie wyniki dla „' + q + '”', akcja: () => idz('szukaj', q) }]));
    }).catch(() => {}), 300);
  });
  pole.addEventListener('keydown', (e) => {
    if (lista.hidden) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault(); akt = Math.max(0, Math.min(ostatnie.length - 1, akt + (e.key === 'ArrowDown' ? 1 : -1)));
      [...lista.children].forEach((b, i) => b.classList.toggle('akt', i === akt));
    } else if (e.key === 'Enter') { e.preventDefault(); wybierz(akt >= 0 ? akt : ostatnie.length - 1); }
  });
  document.addEventListener('click', (e) => { if (!e.target.closest('.szukaj-glob')) lista.hidden = true; });
})();

// ---------------- start ----------------
function uruchom() {
  rysujMenu();
  // wysokość przyklejonego nagłówka – zakładki profili przyklejają się tuż pod nim
  const ustawWysGory = () => { const g = document.querySelector('.gora'); if (g) document.documentElement.style.setProperty('--wys-gory', g.offsetHeight + 'px'); };
  ustawWysGory(); window.addEventListener('resize', ustawWysGory);
  // F2: start z pamięci przeglądarki od razu; świeży w tle uzupełnia dane (i odświeża widok, gdy zmienił się zakres)
  const startZap = czytajTrwale('start[]');
  const swiezy = serwer('start').then((st) => { zapiszTrwale('start[]', st); return st; });
  if (startZap) swiezy.then((st) => {
    S.start = st; S.moje = st.moje || {};
    st.jednostki.forEach((j) => { S.jedn[j.id] = j; (j.czlonkowie || []).forEach((c) => { S.jedn[c.id] = c; }); });
    zastosujInfoStacji(); rysujUlubioneMenu();
    if (st.od) $('#info-danych').textContent = `${st.jednostki.length} stacji · ${dataPL(st.od)} – ${dataPL(st.do)}`;
    if (st.do !== startZap.w.do || st.jednostki.length !== startZap.w.jednostki.length) { if (S.preset) ustawOkres(S.preset); odswiezWidokWMiejscu(); }
  }).catch(() => {});
  (startZap ? Promise.resolve(startZap.w) : swiezy).then((st) => {
    S.start = st; S.moje = st.moje || {};
    st.jednostki.forEach((j) => { S.jedn[j.id] = j; (j.czlonkowie || []).forEach((c) => { S.jedn[c.id] = c; }); });
    zastosujInfoStacji();
    rysujUlubioneMenu();
    if (!st.od) { $('#tresc').replaceChildren(karta('Jeszcze brak danych', 'Panel pokaże dane, gdy Odbiornik przyjmie i przeliczy pierwsze porcje.')); return; }
    $('#info-danych').textContent = `${st.jednostki.length} stacji · ${dataPL(st.od)} – ${dataPL(st.do)}`;
    const p = window.PARAMETRY || {};
    ustawOkres(30);
    if (p.od && p.do) { S.od = p.od; S.do = p.do; S.preset = null; }
    if (p.st) S.wybrane = p.st.split(',').filter((x) => S.jedn[x]);
    let arg = p.a;
    if (arg && /^[[{]/.test(arg)) { try { arg = JSON.parse(arg); } catch (e) { /* zwykły tekst */ } }
    idz(WIDOKI[p.w] ? p.w : 'start', arg || undefined, true);
    Pomiar.zapisz('(otwarcie panelu)', performance.now(), true);
    try { Odtwarzacz.przywroc(); } catch (e) { /* bez odtwarzacza */ }
  }).catch((e) => bladW($('#tresc'), e));
}
