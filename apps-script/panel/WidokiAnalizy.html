<script>
'use strict';
// ======================= Analizy (N1–N10), ramówki (EPG), playlisty, alerty i ustawienia =======================

// ---------------- ANALIZY ----------------
const ANALIZY = [
  ['kwota', 'Kwota polska', 'N1'], ['rotacja', 'Rotacja', 'N2'], ['trendy', 'Cykl hitu i trendy', 'N3'], ['wiek', 'Wiek repertuaru', 'N4'],
  ['pory', 'Pory dnia', 'N5'], ['podobienstwo', 'Mapa podobieństwa', 'N6'], ['format', 'Zmiany formatu', 'N7'], ['pary', 'Co po czym', 'N8'], ['skoki', 'Skoki wykonawców', 'N9'],
  ['kategorie', 'Kategorie rotacji', 'A3'], ['wskazniki', 'Wskaźniki stacji', 'A1'], ['zasieg', 'Zasięg emisji', 'A6'], ['kompletnosc', 'Kompletność danych', 'A14'],
];
const A = { tab: 'kwota', j: null };
// domyślnie „wszystkie stacje łącznie” (serwer sumuje stacje główne; sieci bez podwójnego liczenia)
function stacjaAnalizy() { return A.j && (S.jedn[A.j] || A.j === '_wszystkie') ? A.j : '_wszystkie'; }
function wyborJednej(naZmiane) {
  const s = el('select', { 'aria-label': 'Stacja' }, [el('option', { value: '_wszystkie' }, 'Wszystkie stacje łącznie')].concat(
    S.start.jednostki.slice().sort((a, b) => porownajStacje(a.id, b.id)).map((j) => el('option', { value: j.id }, j.nazwa))));
  s.value = stacjaAnalizy();
  s.addEventListener('change', () => { A.j = s.value; naZmiane(); });
  return s;
}

WIDOKI.analizy = (box, tab) => {
  if (tab && ANALIZY.some((x) => x[0] === tab)) A.tab = tab;
  const wynik = el('div', { style: { display: 'grid', gap: '14px' } });
  const odswiez = () => idz('analizy', A.tab, true);
  const potrzebujeStacji = ['rotacja', 'pory', 'format', 'pary', 'kategorie'].includes(A.tab);
  box.replaceChildren(el('h1', {}, 'Analizy'),
    el('div', { class: 'zakladki', role: 'tablist' }, ANALIZY.map(([id, n]) => el('button', { class: A.tab === id ? 'akt' : '', role: 'tab', 'aria-selected': String(A.tab === id), onclick: () => idz('analizy', id) }, n))),
    pasekFiltrow(odswiez, { stacje: !potrzebujeStacji && !['podobienstwo', 'trendy', 'skoki', 'wskazniki', 'zasieg', 'kompletnosc'].includes(A.tab) }),
    przyciskZapiszWidok('analizy', A.tab),
    potrzebujeStacji ? el('div', { class: 'wiersz' }, el('span', { class: 'sub' }, 'Stacja:'), wyborJednej(odswiez)) : null,
    wynik);
  wynik.append(...szkielet(2));
  const tabA = A.tab;
  (ANALIZA[tabA] || (() => {}))(wynik);
  // N1: zdanie „W skrócie” nad wynikami – z tych samych zapytań co analiza (są już w pamięci, serwer nie liczy drugi raz)
  if (W_SKROCIE[tabA]) W_SKROCIE[tabA]().then((t) => {
    if (!t || S.widok !== 'analizy' || A.tab !== tabA) return;
    const st = wynik.querySelector('.w-skrocie'); if (st) st.remove();
    wynik.prepend(el('p', { class: 'w-skrocie' }, el('b', {}, 'W skrócie: '), t));
  }).catch(() => {});
};
const W_SKROCIE = {
  kwota: () => serwerP('kwotaPolska', S.wybrane, S.od, S.do).then((r) => {
    const z = r.stacje.filter((x) => x.pokrycie >= 0.3 && x.udzialPL != null).sort((a, b) => b.udzialPL - a.udzialPL);
    if (!z.length) return null;
    return `najwięcej utworów po polsku gra ${z[0].nazwa} (${proc(z[0].udzialPL)}), najmniej ${z[z.length - 1].nazwa} (${proc(z[z.length - 1].udzialPL)}); poniżej 33%: ${z.filter((x) => x.udzialPL < 0.33).length} z ${z.length} stacji (wśród utworów o znanym języku, emisje, nie czas).`;
  }),
  rotacja: () => serwerP('rotacja', stacjaAnalizy(), S.od, S.do).then((r) => (r.utworow ? `${r.nazwa}: ${fmt(r.emisji)} emisji ${fmt(r.utworow)} różnych utworów, średnio ${fmt(r.emisji / r.utworow, 1)} emisji na utwór; najczęściej ${r.top[0].a} – ${r.top[0].t} (${fmt(r.top[0].n)}×).` : null)),
  trendy: () => serwerP('cyklZycia', S.od, S.do, A.min || 30).then((r) => (r.stacje && r.stacje.length ? `nowości najwcześniej gra ${r.stacje[0].nazwa}; ${fmt(r.debiutow)} utworów zadebiutowało w tym okresie.` : null)),
  wiek: () => serwerP('wiekRepertuaru', (S.wybrane.length ? S.wybrane : ['_wszystkie']).slice(0, 6), S.od.slice(0, 4), S.do.slice(0, 4)).then((r) => {
    const z = r.stacje.map((s) => { let su = 0, n = 0; s.miesiace.forEach((m) => { if (m.sredniRok != null) { su += m.sredniRok * m.zRokiem; n += m.zRokiem; } }); return n ? [s.nazwa, su / n] : null; }).filter(Boolean).sort((a, b) => a[1] - b[1]);
    if (!z.length) return null;
    return z.length === 1 ? `średni rok wydania granych utworów: ${fmt(z[0][1])} (${z[0][0]}).` : `najstarszy repertuar: ${z[0][0]} (śr. ${fmt(z[0][1])}), najnowszy: ${z[z.length - 1][0]} (śr. ${fmt(z[z.length - 1][1])}).`;
  }),
  wskazniki: () => serwerP('wskazniki', S.od, S.do).then((r) => {
    const z = r.stacje.filter((x) => x.hill1 != null && x.emisji >= 300); if (z.length < 2) return null;
    const h = z.slice().sort((a, b) => b.hill1 - a.hill1), u = z.slice().sort((a, b) => b.unikalnosc - a.unikalnosc);
    return `najbardziej różnorodna playlista: ${h[0].nazwa} (N1 = ${fmt(h[0].hill1)}), najmniej: ${h[h.length - 1].nazwa} (${fmt(h[h.length - 1].hill1)}); najwięcej utworów granych tylko u siebie: ${u[0].nazwa} (${proc(u[0].unikalnosc)} emisji).`;
  }),
  kompletnosc: () => serwerP('kompletnoscDanych', S.do).then((r) => { if (!r.stacje.length) return null; const z = r.stacje.filter((x) => x.kompletnosc < 0.8); return z.length ? `poniżej 80% oczekiwanych danych w ostatnich 7 dniach: ${z.map((x) => x.nazwa + ' (' + proc(x.kompletnosc) + ')').join(', ')}.` : 'wszystkie stacje mają w ostatnich 7 dniach co najmniej 80% zwykłej liczby utworów.'; }),
  pory: () => serwerP('poryDnia', stacjaAnalizy(), S.od, S.do).then((r) => { const g = r.godziny.slice().sort((a, b) => b.emisji - a.emisji); return g[0].emisji ? `${r.nazwa}: najwięcej utworów o ${g[0].h}:00, najmniej o ${g[23].h}:00.` : null; }),
  podobienstwo: () => serwerP('podobienstwoStacji', S.od, S.do).then((r) => {
    const p = []; r.stacje.forEach((a, i) => r.stacje.forEach((b, j) => { if (j > i) p.push([a.nazwa, b.nazwa, r.macierz[i][j]]); }));
    if (!p.length) return null; p.sort((x, y) => y[2] - x[2]);
    return `najbardziej podobne: ${p[0][0]} i ${p[0][1]} (${proc(p[0][2])}); najbardziej różne: ${p[p.length - 1][0]} i ${p[p.length - 1][1]} (${proc(p[p.length - 1][2])}).`;
  }),
  format: () => serwerP('zmianyFormatu', stacjaAnalizy(), S.od.slice(0, 7), S.do.slice(0, 7)).then((r) => {
    if (r.miesiace.length < 3) return null;
    const z = r.miesiace.filter((m) => m.zmiana);
    return z.length ? `${r.nazwa}: możliwa zmiana formatu w ${z.map((m) => miesPL(m.m)).join(', ')}.` : `${r.nazwa}: bez wyraźnych zmian formatu (średnie podobieństwo miesięcy ${proc(r.srednia)}).`;
  }),
  pary: () => serwerP('coPoCzym', stacjaAnalizy(), roznicaDni(S.od, S.do) > 92 ? dodajDni(S.do, -92) : S.od, S.do).then((r) => (r.pary && r.pary.length ? `najczęstsza para: ${r.pary[0].zNazwa} → ${r.pary[0].naNazwa} (${fmt(r.pary[0].razy)}×).` : null)),
  skoki: () => serwerP('skokiWykonawcow', roznicaDni(S.od, S.do) > 185 ? dodajDni(S.do, -185) : S.od, S.do).then((r) => (r.skoki && r.skoki.length ? `największy skok: ${r.skoki[0].wykonawca} ${dataPL(r.skoki[0].dzien)} – ${fmt(r.skoki[0].emisji)} emisji wobec zwykle ${fmt(r.skoki[0].zwykle, 1)}.` : null)),
  kategorie: () => (stacjaAnalizy() === '_wszystkie' ? serwerP('kategorieRotacjiWszystkie', S.od, S.do).then((r) => {
    const z = r.stacje.filter((x) => x.emisji > 100); if (!z.length) return null;
    const pw = z.slice().sort((a, b) => (b.podsum.power.udzial - a.podsum.power.udzial)), gd = z.slice().sort((a, b) => (b.podsum.gold.udzial - a.podsum.gold.udzial));
    return `najmocniej na power stawia ${pw[0].nazwa} (${proc(pw[0].podsum.power.udzial)} emisji)` + (gd[0].podsum.gold.udzial > 0 ? `, najwięcej gold gra ${gd[0].nazwa} (${proc(gd[0].podsum.gold.udzial)}).` : '; gold/recurrent wymagają roku wydania – metadanych jeszcze za mało.');
  }) : serwerP('kategorieRotacji', stacjaAnalizy(), S.od, S.do).then((r) => `${r.nazwa}: power ${proc(r.podsum.power.udzial)}, current ${proc(r.podsum.current.udzial)}, recurrent ${proc(r.podsum.recurrent.udzial)}, gold ${proc(r.podsum.gold.udzial)} emisji.`)),
};

const ANALIZA = {};
const blad = (box) => (e) => bladW(box, e);
const stacjaKomorka = (x) => el('span', { class: 'wiersz', style: { flexWrap: 'nowrap' } }, logo(x.id, 'm'), x.nazwa);

// A3: kategorie rotacji – zestawienie wszystkich stacji albo utwory jednej stacji w każdej roli
const KAT_ROT = [['power', 'Power', 'var(--s2)', 'najczęściej grane'], ['current', 'Current', 'var(--s3)', 'nowości w rotacji'], ['recurrent', 'Recurrent', 'var(--s1)', 'niedawne przeboje'],
  ['gold', 'Gold', 'var(--s4)', 'starsze utwory'], ['sporadyczne', 'Sporadyczne', 'var(--tekst3)', 'rzadziej niż raz w tygodniu']];
const paskiKategorii = (podsum) => el('div', { class: 'pasek-kat', role: 'img', 'aria-label': 'Udział kategorii w emisjach' },
  KAT_ROT.map(([k, n, kol]) => podsum[k] && podsum[k].udzial ? el('i', { title: n + ': ' + proc(podsum[k].udzial), style: { width: (podsum[k].udzial * 100).toFixed(2) + '%', background: kol } }) : null));
const legendaKategorii = () => el('div', { class: 'legenda' }, KAT_ROT.map(([, n, kol, op]) => el('span', { style: { '--kolor': kol } }, n + ' – ' + op)));
function kategorieRotacji(box, j) {
  box.replaceChildren(...szkielet(1));
  serwerP('kategorieRotacji', j, S.od, S.do).then((r) => {
    let akt = 'power';
    const lista = el('div'), chipy = el('div', { class: 'filtry', style: { marginTop: '10px' } });
    const rysuj = () => {
      chipy.replaceChildren(...KAT_ROT.map(([k, n, kol]) => el('button', { class: 'chip' + (akt === k ? ' akt' : ''), style: { borderLeft: '4px solid ' + kol }, onclick: () => { akt = k; rysuj(); } },
        n + ' · ' + fmt((r.podsum[k] || {}).utworow || 0) + ' utw. · ' + proc((r.podsum[k] || {}).udzial || 0))));
      const ut = r.utwory.filter((x) => x.kat === akt);
      lista.replaceChildren(tabela([['', (x, i) => i + 1, 'num'], ['Utwór', utworKomorka, null, (x) => x.a + ' – ' + x.t], ['Emisje', (x) => fmt(x.n), 'num', (x) => x.n],
        ['Na tydzień', (x) => fmt(x.naTydzien, 1), 'num', (x) => x.naTydzien], ['Rok', (x) => x.y || '–', 'num tylko-szeroki', (x) => x.y || ''],
        ['W bazie od', (x) => (x.pierwsza ? dataPL(x.pierwsza) : '–'), 'num tylko-szeroki', (x) => x.pierwsza || '']], ut,
      { limit: 30, klik: (x) => idz('utwor', x.k), nazwaEksportu: 'Kategoria ' + akt + ' – ' + r.nazwa + ' ' + S.od + ' ' + S.do, pusta: 'Brak utworów w tej kategorii.' }));
    };
    rysuj();
    box.replaceChildren(paskiKategorii(r.podsum), legendaKategorii(),
      el('p', { class: 'sub', style: { marginTop: '6px' } }, `${fmt(r.emisji)} emisji w ${fmt(r.tygodni, 1)} tyg.; power: co najmniej ${r.progPower ? fmt(r.progPower, 1) : '–'} emisji tygodniowo. Wiek: rok wydania, a gdy nieznany – pierwsza emisja w bazie (od 04.2023).`),
      chipy, lista);
  }).catch((e) => bladW(box, e));
}
ANALIZA.kategorie = (box) => {
  const j = stacjaAnalizy();
  if (j !== '_wszystkie') { const k = el('div'); box.replaceChildren(karta('Kategorie rotacji – ' + nazwa(j), 'Rola utworów w playliście stacji w wybranym okresie. Wybierz kategorię, by zobaczyć jej utwory i wyeksportować listę.', k)); kategorieRotacji(k, j); return; }
  serwerP('kategorieRotacjiWszystkie', S.od, S.do).then((r) => {
    box.replaceChildren(karta('Kategorie rotacji – każda stacja', 'Udział kategorii w emisjach stacji w wybranym okresie. Kliknij stację, by zobaczyć i wyeksportować utwory każdej kategorii (albo wybierz ją w polu „Stacja”).',
      legendaKategorii(),
      tabela([['Stacja', stacjaKomorka, null, (x) => x.nazwa], ['Rozkład', (x) => el('div', { style: { minWidth: '140px' } }, paskiKategorii(x.podsum)), null, () => '']]
        .concat(KAT_ROT.map(([k, n]) => [n, (x) => proc((x.podsum[k] || {}).udzial || 0), 'num' + (k === 'sporadyczne' || k === 'recurrent' ? ' tylko-szeroki' : ''), (x) => (x.podsum[k] || {}).udzial || 0]))
        .concat([['Próg power', (x) => (x.progPower ? fmt(x.progPower, 1) + '/tydz.' : '–'), 'num tylko-szeroki', (x) => x.progPower || '']]),
      r.stacje, { klik: (x) => { A.j = x.id; idz('analizy', 'kategorie', true); }, nazwaEksportu: 'Kategorie rotacji ' + S.od + ' ' + S.do })));
  }).catch(blad(box));
};

// N1
ANALIZA.kwota = (box) => serwerP('kwotaPolska', S.wybrane, S.od, S.do).then((r) => {
  const lista = r.stacje.slice().sort((a, b) => (b.udzialPL || 0) - (a.udzialPL || 0));
  const bezJezyka = !lista.some((x) => x.pokrycie);
  box.replaceChildren(karta('Utwory w języku polskim', 'Ustawa o radiofonii i telewizji (art. 15 ust. 2): co najmniej 33% miesięcznego czasu nadawania utworów słowno-muzycznych to utwory w języku polskim, z tego co najmniej 60% w godz. 5:00–24:00. ' +
    'Tu liczymy emisje (nie czas) i tylko utwory o znanym języku tekstu (lrclib.net); instrumentalne pominięte. To szacunek, nie kontrola zgodności.',
  tabela([['Stacja', stacjaKomorka, null, (x) => x.nazwa],
    ['Po polsku', (x) => el('span', { class: 'wiersz', style: { flexWrap: 'nowrap', gap: '8px' } }, el('span', { class: 'pasek', style: { width: '90px', display: 'inline-block' } }, el('i', { style: { width: ((x.udzialPL || 0) * 100).toFixed(1) + '%', background: x.udzialPL != null && x.udzialPL < 0.33 ? 'var(--spadek)' : '' } })), proc(x.udzialPL)), 'num', (x) => x.udzialPL],
    ['Z tego 5–24', (x) => proc(x.udzialPLwDzien), 'num', (x) => x.udzialPLwDzien],
    ['Znany język', (x) => proc(x.pokrycie), 'num tylko-szeroki', (x) => x.pokrycie], ['Emisji', (x) => fmt(x.emisji), 'num tylko-szeroki', (x) => x.emisji]],
  lista, { klik: (x) => idz('stacja', x.id), nazwaEksportu: 'Kwota polska ' + S.od + ' ' + S.do, pusta: 'Brak danych o języku w tym okresie (metadane uzupełniają się każdej nocy).' }),
  el('p', { class: 'sub', style: { marginTop: '8px' } }, 'Czerwony pasek: poniżej 33% wśród utworów o znanym języku. Przy pokryciu poniżej ok. 70% wynik może się jeszcze wyraźnie zmienić.')));
  if (bezJezyka) box.prepend(infoMetadane(el('div', { class: 'karta' }), 'języka tekstu utworów (lrclib.net)'));
  const zMies = lista.filter((x) => Object.keys(x.mies).length > 1).slice(0, 6);
  if (zMies.length) {
    const mies = [...new Set(zMies.flatMap((x) => Object.keys(x.mies)))].sort(), w = el('div', { class: 'wykres' });
    box.append(karta('Miesiąc po miesiącu', 'Udział utworów po polsku wśród utworów o znanym języku (do 6 stacji z najwyższym udziałem).', w));
    linie(w, mies.map(miesPL), zMies.map((x) => ({ nazwa: x.nazwa, jednostka: x.id, wartosci: mies.map((m) => (x.mies[m] && x.mies[m].znany ? x.mies[m].pl / x.mies[m].znany : null)) })), { format: proc, procenty: true, minY: 0 });
  }
}).catch(blad(box));

// N2
ANALIZA.rotacja = (box) => serwerP('rotacja', stacjaAnalizy(), S.od, S.do).then((r) => {
  const godz = (h) => (h == null ? '–' : h < 48 ? fmt(h, 1) + ' h' : fmt(h / 24, 1) + ' dni');
  box.replaceChildren(
    kafle([['Emisji', fmt(r.emisji), r.nazwa], ['Różnych utworów', fmt(r.utworow), ''], ['Emisji na utwór', fmt(r.emisji / Math.max(1, r.utworow), 1), 'średnio']]),
    karta('Najbardziej „zajechane”', 'Utwory z ≥ 20 emisjami, które wracają najczęściej (najkrótszy średni odstęp między emisjami).',
      tabela([['Utwór', utworKomorka, null, (x) => x.a + ' – ' + x.t], ['Emisje', (x) => fmt(x.n), 'num'], ['Średni odstęp', (x) => godz(x.sredniOdstep), 'num', (x) => x.sredniOdstep],
        ['Najkrótszy', (x) => godz(x.minOdstep), 'num tylko-szeroki', (x) => x.minOdstep], ['Maks. na dobę', (x) => fmt(x.maksDoba), 'num tylko-szeroki']], r.zajechane, { klik: (x) => idz('utwor', x.k), nazwaEksportu: 'Zajechane ' + r.nazwa, pusta: 'Żaden utwór nie ma 20 emisji w tym okresie.' })),
    karta('Najczęściej grane i jak często wracają', null,
      tabela([['Utwór', utworKomorka, null, (x) => x.a + ' – ' + x.t], ['Emisje', (x) => fmt(x.n), 'num'], ['Dni z emisją', (x) => fmt(x.dni), 'num tylko-szeroki'], ['Średni odstęp', (x) => godz(x.sredniOdstep), 'num', (x) => x.sredniOdstep]],
        r.top, { klik: (x) => idz('utwor', x.k), nazwaEksportu: 'Rotacja ' + r.nazwa })));
}).catch(blad(box));

// N3
ANALIZA.trendy = (box) => {
  const min = el('select', { 'aria-label': 'Minimalna liczba emisji' }, [10, 30, 100, 300].map((n) => el('option', { value: n }, 'debiuty z ≥ ' + n + ' emisjami')));
  min.value = A.min || 30;
  min.addEventListener('change', () => { A.min = +min.value; ANALIZA.trendy(box); });
  box.replaceChildren(el('div', { class: 'wiersz' }, min), ...szkielet(2));
  serwerP('cyklZycia', S.od, S.do, +min.value).then((r) => {
    const w = el('div', { class: 'wykres' });
    box.replaceChildren(el('div', { class: 'wiersz' }, min),
      karta('Stacje wyznaczające trendy', `Dla każdego z ${fmt(r.debiutow)} utworów, które zadebiutowały w tym okresie: kolejność, w jakiej stacje zagrały go pierwszy raz. Niższy średni percentyl = stacja gra nowości wcześniej niż inne. Liczą się utwory zagrane przez ≥ 5 stacji.`,

      ['Playlista', (x) => el('span', { class: 'wiersz', style: { flexWrap: 'nowrap' } }, x.jednostka ? logo(x.jednostka, 'm') : null, (x.jednostka ? nazwa(x.jednostka) : 'Wszystkie stacje') + ` – top ${x.n} z ${x.dni} dni`)],
      ['Stan', (x) => (x.blad ? el('span', { class: 'blad' }, x.blad) : x.url ? el('span', {}, el('a', { href: x.url, target: '_blank', rel: 'noopener' }, 'otwórz'),
        ' · ' + (x.odswiezona ? 'odświeżona ' + dataPL(x.odswiezona) : 'w kolejce') + (x.brakow ? ' · ' + x.brakow + ' utw. nie ma w Spotify' : ''),
        x.publiczna === true ? el('span', { class: 'blad' }, ' · Spotify pokazuje ją jako publiczną') : x.publiczna === false ? el('span', { class: 'sub' }, ' · prywatna') : null)
        : el('span', { class: 'sub' }, 'w kolejce – powstanie przy najbliższym odświeżeniu (ok. 6:00, potem co minutę, aż wszystkie)'))],
      ['', (x, i) => el('button', { class: 'przycisk drugi maly', onclick: () => { lista.splice(i, 1); zapisz(); } }, 'Usuń'), 'num']], lista, { pusta: 'Brak automatycznych playlist.' }));
    const jed = el('select', { 'aria-label': 'Stacja' }, el('option', { value: '' }, 'Wszystkie stacje'), S.start.jednostki.map((j) => el('option', { value: j.id }, j.nazwa)));
    const n = el('input', { type: 'number', value: 50, min: 5, max: 100, style: { width: '72px' }, 'aria-label': 'Liczba utworów' });
    const dni = el('input', { type: 'number', value: 30, min: 1, max: 365, style: { width: '72px' }, 'aria-label': 'Liczba dni' });
    const wszystkie = el('button', { class: 'przycisk drugi', onclick: () => {
      const jest = new Set(lista.map((x) => x.jednostka));
      S.start.jednostki.forEach((j) => { if (!jest.has(j.id)) lista.push({ jednostka: j.id, n: +n.value, dni: +dni.value }); });
      zapisz();
    } }, 'Dodaj dla każdej stacji');
    rysuj();
    const prywatne = el('button', { class: 'przycisk drugi', onclick: (e) => {
      e.currentTarget.disabled = true;
      serwer('spotifyPrywatne').then((w) => { lista = w.lista; rysuj(); toast(w.publicznych ? `Spotify nadal pokazuje ${w.publicznych} jako publiczne – zmień je w aplikacji Spotify („Usuń z profilu” / „Ustaw jako prywatną”)` : 'Wszystkie playlisty są prywatne', 6000); })
        .catch((er) => toast(er.message)).finally(() => { prywatne.disabled = false; });
    } }, 'Ustaw wszystkie jako prywatne');
    box.replaceChildren(el('h1', {}, 'Playlisty'), spBox, kartaAppleListy(),
      karta('Automatyczne playlisty „Top N”', 'Odświeżane codziennie ok. 6:00 (wymaga połączonego Spotify i jednorazowego uruchomienia funkcji zainstalujPanel – patrz instrukcja). Każda to najczęściej grane utwory stacji z ostatnich dni; ta sama playlista w Spotify jest nadpisywana.',
        el('div', { class: 'wiersz' }, jed, 'top', n, 'z', dni, 'dni', el('button', { class: 'przycisk', onclick: () => { lista.push({ jednostka: jed.value, n: +n.value, dni: +dni.value }); zapisz(); } }, 'Dodaj'), wszystkie),
        el('div', { style: { marginTop: '10px' } }, tab),
        el('div', { class: 'wiersz', style: { marginTop: '8px' } }, prywatne, el('span', { class: 'sub' }, 'Nowe playlisty tworzymy jako prywatne (niewidoczne na profilu i w wyszukiwarce; kto ma link, ten je otworzy – Spotify nie pozwala inaczej).'))),
      karta('Apple Music', 'Bezpośredni zapis wymaga płatnego konta Apple Developer. W zakładce Ranking przycisk „Apple Music (CSV)” tworzy plik na Twoim Dysku – zaimportuj go w serwisie do przenoszenia playlist albo przenieś playlistę ze Spotify.'));
  }).catch((e) => bladW(box, e));
};

/** O1: powiadomienia na telefon przez ntfy (alerty, alerty dzienne, przypomnienia, strażnik zadań). */
function kartaNtfy() {
  const box = el('div', {}, el('p', { class: 'stan' }, 'Sprawdzam…'));
  const rysuj = (r) => {
    const akcja = (a) => serwer('ntfyUstawienia', a).then((w) => { rysuj(w); if (a === 'test') toast(w.test ? 'Wysłano – sprawdź telefon' : 'Nie udało się wysłać'); }).catch((e) => toast(e.message));
    box.replaceChildren(r.temat
      ? el('div', {}, el('p', { class: 'opis' }, 'Włączone. W aplikacji ntfy na telefonie: + (subskrybuj temat) → wpisz dokładnie:'),
        el('p', {}, el('code', { style: { fontSize: '15px' } }, r.temat), ' ', el('button', { class: 'przycisk drugi maly', onclick: () => navigator.clipboard && navigator.clipboard.writeText(r.temat).then(() => toast('Skopiowano temat')) }, 'Kopiuj')),
        el('p', { class: 'sub' }, 'Temat działa jak hasło – nie pokazuj go innym. Serwer: ntfy.sh (domyślny w aplikacji).'),
        el('div', { class: 'wiersz', style: { marginTop: '8px' } }, el('button', { class: 'przycisk', onclick: () => akcja('test') }, 'Wyślij test'),
          el('button', { class: 'przycisk drugi', onclick: () => akcja('wlacz') }, 'Nowy temat'), el('button', { class: 'przycisk drugi', onclick: () => akcja('wylacz') }, 'Wyłącz')))
      : el('div', {}, el('p', { class: 'opis' }, 'Wyłączone. Zainstaluj na telefonie aplikację ntfy (Google Play albo F-Droid), potem włącz tutaj – dostaniesz temat do subskrypcji.'),
        el('button', { class: 'przycisk', style: { marginTop: '8px' }, onclick: () => akcja('wlacz') }, 'Włącz powiadomienia')));
  };
  serwer('ntfyUstawienia', 'stan').then(rysuj).catch((e) => box.replaceChildren(el('p', { class: 'blad' }, e.message)));
  return karta('Powiadomienia na telefon (ntfy)', 'Alerty o emisjach, alerty dzienne, przypomnienia o audycjach i strażnik zadań GitHuba także jako powiadomienie na Androidzie. E-mail zostaje jako zapas.', box);
}
/** Wygląd (W3) i dolny pasek na telefonie (M6) – zapisywane w tej przeglądarce. */
function kartaUstawien() {
  const motyw = el('select', { 'aria-label': 'Motyw' }, [['systemowy', 'jak w systemie'], ['jasny', 'jasny'], ['ciemny', 'ciemny']].map(([v, n]) => el('option', { value: v }, n)));
  motyw.value = motywZapisany();
  motyw.addEventListener('change', () => ustawMotyw(motyw.value, true));
  const wybrane = pozycjeDolu().slice();
  const pola = wybrane.map((w, i) => {
    const s = el('select', { 'aria-label': 'Pozycja ' + (i + 1) }, MENU.map(([id, n]) => el('option', { value: id }, n)));
    s.value = w;
    s.addEventListener('change', () => { wybrane[i] = s.value; ustawDol(wybrane); toast('Dolny pasek zmieniony'); });
    return s;
  });
  return karta('Wygląd i dolny pasek', 'Zapisywane w tej przeglądarce.',
    el('div', { class: 'wiersz', style: { margin: '6px 0 12px' } }, el('span', { class: 'sub' }, 'Motyw:'), motyw),
    el('p', { class: 'sub' }, 'Dolny pasek na telefonie (4 pozycje, piąta to „Więcej”):'),
    el('div', { class: 'wiersz', style: { marginTop: '6px' } }, pola, el('button', { class: 'przycisk drugi maly', onclick: () => { ustawDol(null); idz('alerty', null, true); } }, 'Domyślny')));
}
/** Czasy zapytań zmierzone na tym urządzeniu (F9) – do porównania przed i po zmianach. */

  const box = el('div');

    const t = Pomiar.tabela();
    box.replaceChildren(tabela([['Urządzenie', (x) => x.urz, 'sub'], ['Zapytanie', (x) => x.fn], ['Mediana', (x) => fmt(x.med / 1000, 1) + ' s', 'num', (x) => x.med],
      ['90% szybciej niż', (x) => fmt(x.p90 / 1000, 1) + ' s', 'num tylko-szeroki', (x) => x.p90], ['Najdłużej', (x) => fmt(x.max / 1000, 1) + ' s', 'num', (x) => x.max],
      ['Wywołań', (x) => fmt(x.n), 'num tylko-szeroki'], ['Błędy', (x) => (x.bledy ? el('span', { title: x.blad || '' }, fmt(x.bledy)) : '0'), 'num tylko-szeroki', (x) => x.bledy],
      ['Ostatni błąd', (x) => el('span', { class: 'sub' }, x.blad || ''), 'tylko-szeroki', (x) => x.blad || '']], t,
    { limit: 15, pusta: 'Jeszcze brak pomiarów – pojawią się po korzystaniu z panelu.', nazwaEksportu: 'Pomiary czasu panelu' }));
  };
  rysuj();
  return karta('Szybkość panelu na tym urządzeniu', 'Czas każdego zapytania do serwera (ostatnie 60 na funkcję) i otwarcia panelu. Skopiuj i wyślij, gdy coś działa wolno.', box,
    el('div', { class: 'wiersz', style: { marginTop: '8px' } },
      el('button', { class: 'przycisk drugi maly', onclick: () => {
        const tekst = Pomiar.tabela().map((x) => `${x.urz}\t${x.fn}\tmediana ${x.med} ms\tp90 ${x.p90} ms\tmaks ${x.max} ms\tn=${x.n}\tbłędy ${x.bledy}` + (x.blad ? `\tostatni błąd: ${x.blad}` : '')).join('\n');
        (navigator.clipboard ? navigator.clipboard.writeText(tekst) : Promise.reject()).then(() => toast('Skopiowano pomiary'), () => toast('Nie udało się skopiować'));
      } }, 'Kopiuj pomiary'),
      el('button', { class: 'przycisk drugi maly', onclick: () => { Pomiar.wyczysc(); rysuj(); } }, 'Wyczyść')));
}

    const raport = el('input', { type: 'checkbox', checked: !!S.moje.raport });

        el('div', { class: 'wiersz', style: { margin: '8px 0' } }, pole, stBtn, el('button', { class: 'przycisk', onclick: () => {
          if (!pole.value.trim()) return;
          lista.push({ typ: 'wykonawca', tekst: pole.value.trim(), opis: pole.value.trim(), stacje }); pole.value = ''; zapisz();
        } }, 'Dodaj')), tab,

        el('div', { class: 'wiersz', style: { margin: '6px 0' } },

          el('button', { class: 'chip', onclick: () => { if (lista.some((a) => a.typ === 'debiut3')) return toast('Ten alert już jest'); lista.push({ typ: 'debiut3', opis: 'Debiut na ≥ 3 stacjach w 7 dni' }); zapisz(); } }, '+ Debiut na ≥ 3 stacjach'),
          el('button', { class: 'chip', onclick: () => { const t = pole.value.trim(); lista.push(t ? { typ: 'powrot', tekst: t, opis: 'Powrót: ' + t } : { typ: 'powrot', klucz: '_powrot', opis: 'Powrót dowolnego wykonawcy (≥ 30 emisji w bazie)' }); pole.value = ''; zapisz(); } }, '+ Powrót po ≥ 90 dniach'),
