/** Kolejność i widoczność kart Startu (S1) – localStorage 'mb-start'. */
function ukladStartu(domyslne) {
  let z = [];
  try { z = JSON.parse(localStorage.getItem('mb-start') || '[]') || []; } catch (e) { z = []; }
  z = z.filter((x) => domyslne.includes(x.id));
  domyslne.forEach((id) => { if (!z.some((x) => x.id === id)) z.push({ id, ukryta: false }); });
  return z;
}
function dostosujStart(karty) {
  let uklad = ukladStartu(Object.keys(karty));
  const lista = el('div', { style: { display: 'grid', gap: '6px' } });
  const zapisz = () => { try { localStorage.setItem('mb-start', JSON.stringify(uklad)); } catch (e) { /* bez pamięci */ } };
  const rysuj = () => lista.replaceChildren(...uklad.map((x, i) => {
    const cb = el('input', { type: 'checkbox', checked: !x.ukryta });
    cb.addEventListener('change', () => { x.ukryta = !cb.checked; zapisz(); });
    return el('div', { class: 'wiersz', style: { flexWrap: 'nowrap', justifyContent: 'space-between' } },
      el('label', { class: 'wiersz', style: { flexWrap: 'nowrap', cursor: 'pointer' } }, cb, karty[x.id][0]),
      el('span', { class: 'wiersz', style: { flexWrap: 'nowrap', gap: '4px' } },
        el('button', { class: 'ikona-btn', disabled: i === 0, 'aria-label': 'Wyżej', onclick: () => { [uklad[i - 1], uklad[i]] = [uklad[i], uklad[i - 1]]; zapisz(); rysuj(); } }, '↑'),
        el('button', { class: 'ikona-btn', disabled: i === uklad.length - 1, 'aria-label': 'Niżej', onclick: () => { [uklad[i + 1], uklad[i]] = [uklad[i], uklad[i + 1]]; zapisz(); rysuj(); } }, '↓')));
  }));
  rysuj();
  otworzArkusz(el('div', { style: { display: 'grid', gap: '10px' } }, el('h2', {}, 'Dostosuj Start'), el('p', { class: 'sub' }, 'Zaznacz widoczne karty i ustaw ich kolejność. Zapisywane w tej przeglądarce.'), lista,
    el('div', { class: 'wiersz', style: { justifyContent: 'flex-end' } },
      el('button', { class: 'przycisk drugi', onclick: () => { try { localStorage.removeItem('mb-start'); } catch (e) { /* bez pamięci */ } zamknijArkusz(); idz('start', null, true); } }, 'Domyślnie'),
      el('button', { class: 'przycisk', onclick: () => { zamknijArkusz(); idz('start', null, true); } }, 'Gotowe'))));

  const lataBox = el('span', { class: 'wiersz' });

  const maxLat = Math.max(1, Math.floor((Date.parse(dzisISO()) - Date.parse(S.start.od)) / (365.25 * 864e5)));
  if (!G7.lata) G7.lata = [1, 2, 3].filter((l) => l <= maxLat);

      // przewiń listę do bieżącej audycji (tylko wewnątrz listy, nie całą stronę)

    }).catch((e) => lista.replaceChildren(el('p', { class: 'blad' }, e.message)));
  }
  rysujDni(); wczytaj();
  return k;
}

/** Miasta z tabel KBR, w których mierzona jest stacja: [{m (tabela miasta), s (wiersz stacji), miejsce}] – najwyższy udział pierwszy. */
function miastaStacji(id) {
  const R = window.RYNEK_MIASTA;
  if (!R) return [];
  const wynik = [];
  Object.keys(R.miasta).forEach((k) => {
    const m = R.miasta[k], o = m.fale.length - 1;
    const posort = m.stacje.filter((x) => x.udzial[o] != null).sort((a, b) => b.udzial[o] - a.udzial[o]);
    m.stacje.forEach((s) => { if (s.slug === id && s.udzial[o] != null) wynik.push({ m, s, miejsce: posort.indexOf(s) + 1, z: posort.length }); });
  });
  return wynik.sort((a, b) => b.s.udzial[b.m.fale.length - 1] - a.s.udzial[a.m.fale.length - 1]);
}

/** Udział w miastach (Radio Track, tabele KBR). Stacja lokalna: ranking jej miasta z wyróżnieniem; ogólnopolska: tabela miast. */
function rynekLokalny(id) {
  const lista = miastaStacji(id), R = window.RYNEK_MIASTA;
  if (!lista.length) return null;
  const p = (v) => v == null ? '–' : v.toLocaleString('pl-PL', { minimumFractionDigits: 1 }) + '%';
  const zm = (a, b) => { if (a == null || b == null) return el('span', { class: 'zm' }, '–'); const d = Math.round((a - b) * 10) / 10; return el('span', { class: 'zm ' + (d > 0 ? 'w' : d < 0 ? 's' : '') }, (d > 0 ? '▲ ' : d < 0 ? '▼ ' : '= ') + Math.abs(d).toLocaleString('pl-PL') + ' pp'); };
  const fala = lista[0].m.fale[lista[0].m.fale.length - 1], poprz = lista[0].m.fale[lista[0].m.fale.length - 2];
  const pasek = (v, max, moja) => el('span', { class: 'rl-pasek' + (moja ? ' moja' : '') }, el('i', { style: { width: Math.max(2, Math.round(100 * v / max)) + '%' } }));
  const naglowek = el('div', { class: 'rl-nagl' }, el('b', {}, 'Udział w czasie słuchania w miastach'), el('span', { class: 'sub' }, ' · ' + fala + ' (vs ' + poprz + ')'));
  const zrodlo = el('div', { class: 'sub rl-zr' }, 'Źródło: ', R.zrodlo, ' · tabele: ', el('a', { href: 'https:\/\/badaniaradiowe.pl/wyniki-sluchalnosci/', target: '_blank', rel: 'noopener' }, 'badaniaradiowe.pl'), ' (pobrane ' + R.pobrano + ')');
  let tresc;
  if (lista.length <= 2) {
    // stacja lokalna: ranking miasta – czołówka + ta stacja
    tresc = lista.map(({ m, s, miejsce, z }) => {
      const o = m.fale.length - 1, posort = m.stacje.filter((x) => x.udzial[o] != null).sort((a, b) => b.udzial[o] - a.udzial[o]);
      const pokaz = posort.filter((x, i) => i < 6 || x === s), max = posort[0].udzial[o];
      return el('div', { class: 'rl-miasto' },
        el('div', { class: 'rl-tyt' }, el('a', { href: m.url, target: '_blank', rel: 'noopener' }, m.miasto), el('span', { class: 'sub' }, ' · ' + miejsce + '. miejsce z ' + z + ' · próba N = ' + (m.n ? m.n[o].toLocaleString('pl-PL') : '?'))),
        el('div', { class: 'rl-tab' }, pokaz.map((x) => el('div', { class: 'rl-w' + (x === s ? ' moja' : '') },
          el('span', { class: 'rl-m' }, (posort.indexOf(x) + 1) + '.'), el('span', { class: 'rl-n', title: x.nazwa }, x.nazwa),
          pasek(x.udzial[o], max, x === s), el('b', {}, p(x.udzial[o])), zm(x.udzial[o], x.udzial[o - 1])))),
        el('div', { class: 'sub' }, 'Ta stacja w kolejnych falach: ', m.fale.map((f, i) => f.replace(/ (\d{4})/g, ' $1') + ': ' + p(s.udzial[i])).join(' · ')));
    });
  } else {
    const max = Math.max(...lista.map((x) => x.s.udzial[x.m.fale.length - 1]));
    tresc = el('div', { class: 'rl-tab' }, lista.map(({ m, s, miejsce, z }) => {
      const o = m.fale.length - 1;
      return el('div', { class: 'rl-w', title: s.nazwa + ' · N = ' + (m.n ? m.n[o] : '?') },
        el('span', { class: 'rl-n' }, el('a', { href: m.url, target: '_blank', rel: 'noopener' }, m.miasto)),
        el('span', { class: 'rl-m sub' }, miejsce + '/' + z), pasek(s.udzial[o], max, false), el('b', {}, p(s.udzial[o])), zm(s.udzial[o], s.udzial[o - 1]));
    }));
  }
  return el('div', { class: 'rynek-lok' }, naglowek, tresc, zrodlo);
}

/** „Co gra”: wykonawcy, gatunki, dekady, język – z 50 najczęściej granych utworów okresu. */
function coGra(box, p) {
  const top = p.top || [];
  if (!top.length) { box.replaceChildren(el('p', { class: 'opis' }, 'Brak emisji w tym okresie.')); return; }
  const suma = (f) => { const w = {}; top.forEach((x) => [].concat(f(x) || []).forEach((k) => { if (k) w[k] = (w[k] || 0) + x.n; })); return Object.entries(w).sort((a, b) => b[1] - a[1]); };
  const wsz = top.reduce((s, x) => s + x.n, 0);
  const wyk = suma((x) => String(x.a).split(/\s+(?:\/|&|feat\.?|ft\.?|x)\s+/i)[0]).slice(0, 8);
  const gat = suma((x) => x.g).slice(0, 8), gatZnane = top.filter((x) => x.g && x.g.length).reduce((s, x) => s + x.n, 0);
  const dek = suma((x) => (x.y ? Math.floor(x.y / 10) * 10 + 's' : null)), lataZnane = top.filter((x) => x.y).reduce((s, x) => s + x.n, 0);
  const pl = top.filter((x) => x.c === 'PL').reduce((s, x) => s + x.n, 0), kraj = top.filter((x) => x.c).reduce((s, x) => s + x.n, 0);
  // lista pasków: 8 pierwszych, reszta po „Pokaż wszystkie”
  const pasek = (lista, mian) => listaRozwijana(lista.map(([k, v]) => el('div', { style: { display: 'grid', gridTemplateColumns: 'minmax(90px, 1fr) 2fr auto', gap: '8px', alignItems: 'center', fontSize: '14px' } },
    el('span', { style: { overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' } }, k), el('div', { class: 'pasek' }, el('i', { style: { width: (100 * v / lista[0][1]).toFixed(1) + '%' } })), el('span', { class: 'sub num' }, proc(v / mian)))), 8, 'lista-paskow');
  const glDek = dek.slice(0, 2).map((x) => x[0]).join(' i ');
  box.replaceChildren(
    el('p', { style: { marginBottom: '10px' } }, `W skrócie: ${kraj ? proc(pl / kraj) + ' polskich wykonawców, ' : ''}${glDek ? 'najwięcej utworów z lat ' + glDek : 'lata wydania jeszcze nieznane'}${gat.length ? ', przeważa ' + gat[0][0] : ''}.`),
    el('div', { class: 'siatka3' },
      el('div', {}, el('h3', {}, 'Wykonawcy'), pasek(wyk, wsz)),
      el('div', {}, el('h3', {}, 'Gatunki'), gat.length ? pasek(gat, gatZnane) : el('p', { class: 'sub' }, 'Gatunki znamy tylko dla utworów z bazy Songstera.'), gatZnane ? el('p', { class: 'sub' }, 'Znane dla ' + proc(gatZnane / wsz) + ' emisji') : null),
      el('div', {}, el('h3', {}, 'Dekady wydania'), dek.length ? pasek(dek, lataZnane) : el('p', { class: 'sub' }, 'Brak lat wydania.'), lataZnane ? el('p', { class: 'sub' }, 'Znane dla ' + proc(lataZnane / wsz) + ' emisji') : null)));
}

/** Formularz edycji stacji (nazwa, logo, strona, artykuł Wikipedii, grupa, informacje, słuchalność). */
function edytujStacje(id) {
  const wl = Object.assign({}, (S.start.infoStacji || {})[id] || {}), auto = (window.STACJE_DANE || {})[id] || {};
  const pola = [
    ['nazwa', 'Nazwa', S.jedn[id] ? (S.jedn[id]._nazwaDomyslna || S.jedn[id].nazwa) : id],
    ['www', 'Strona WWW', auto.www || 'https:\/\/…'], ['wiki', 'Artykuł w polskiej Wikipedii (tytuł)', auto.wiki || 'np. Radio Poznań'],
    ['grupa', 'Grupa (filtr w Stacjach i Ramówkach)', (S.start.grupy || {})[id] || 'Pozostałe'],
    ['miasto', 'Skąd (miasto, region)', 'z Wikidata, jeśli puste'], ['zalozona', 'Powstała', 'np. 1993 albo 15.04.1993'],
    ['format', 'Format / gatunek', 'np. AC, CHR, rock, publicystyka'], ['gatunki', 'Gatunki muzyczne', 'np. pop, rock, dance'],
    ['wlasciciel', 'Właściciel', 'z Wikidata, jeśli puste'], ['grupaDocelowa', 'Grupa docelowa', 'np. 25–49, mieszkańcy miast'],
    ['udzial', 'Udział w rynku', 'np. 9,8% (Radio Track, VII–IX 2026)'], ['sluchalnosc', 'Słuchalność / zasięg', 'np. 4,1 mln dziennie'],
    ['zrodloSluchalnosci', 'Źródło i data słuchalności', 'np. Radio Track Kantar, III kw. 2026'],
  ];
  const wejscia = {};
  const grupy = [...new Set(Object.values(S.start.grupy || {}).concat(['Pozostałe']))];
  const lista = el('datalist', { id: 'grupy-lista' }, grupy.map((g) => el('option', { value: g })));
  const bio = el('textarea', { rows: 5, style: { width: '100%' }, placeholder: 'Bio – puste = streszczenie z Wikipedii' }); bio.value = wl.bio || '';
  const podglad = logo(id, 'd');
  const plik = el('input', { type: 'file', accept: 'image/png,image/jpeg,image/webp,image/svg+xml' });
  let noweLogo;
  plik.addEventListener('change', () => {
    const f = plik.files[0]; if (!f) return;
    const img = new Image();
    img.onload = () => {   // zmniejszenie do 96 × 96 (kwadrat, białe tło przy przezroczystości tylko dla JPG)
      const c = document.createElement('canvas'); c.width = c.height = 96;
      const k = Math.min(96 / img.width, 96 / img.height), w = img.width * k, h = img.height * k;
      c.getContext('2d').drawImage(img, (96 - w) / 2, (96 - h) / 2, w, h);
      noweLogo = c.toDataURL('image/png');
      const nowy = el('img', { class: 'logo d', src: noweLogo, alt: '' }); box.querySelector('.logo.d').replaceWith(nowy);
      URL.revokeObjectURL(img.src);
    };
    img.src = URL.createObjectURL(f);
  });
  const box = el('div', { style: { display: 'grid', gap: '10px' } },
    el('h2', {}, 'Edytuj stację'),
    el('div', { class: 'wiersz', style: { flexWrap: 'nowrap' } }, podglad, el('div', { style: { display: 'grid', gap: '6px' } }, el('label', { class: 'sub' }, 'Logo (PNG, JPG, WebP, SVG – zmniejszane do 96 px)'), plik,
      wl.logo ? el('button', { class: 'przycisk drugi maly', onclick: () => { noweLogo = ''; toast('Logo wróci do domyślnego po zapisaniu'); } }, 'Przywróć domyślne logo') : null)),
    lista,
    el('div', { class: 'info-siatka formularz' }, pola.map(([k, n, ph]) => {
      const i = el('input', { type: 'text', value: wl[k] || '', placeholder: ph, style: { width: '100%' } });
      if (k === 'grupa') i.setAttribute('list', 'grupy-lista');
      wejscia[k] = i;
      return el('label', { style: { display: 'grid', gap: '3px' } }, el('span', { class: 'sub' }, n), i);
    })),
    el('label', { style: { display: 'grid', gap: '3px' } }, el('span', { class: 'sub' }, 'Bio'), bio),
    el('p', { class: 'sub' }, 'Puste pole = wartość automatyczna (Wikidata, Wikipedia, odSluchane). Zmiany widzisz tylko Ty; zapisywane w pliku stacje_info.json w folderze danych na Dysku.'),
    el('div', { class: 'wiersz', style: { justifyContent: 'flex-end' } },
      el('button', { class: 'przycisk drugi', onclick: zamknijArkusz }, 'Anuluj'),
      el('button', { class: 'przycisk', onclick: (e) => {
        const zm = { bio: bio.value };
        Object.entries(wejscia).forEach(([k, i]) => { zm[k] = i.value; });
        if (noweLogo !== undefined) zm.logo = noweLogo;
        e.currentTarget.disabled = true;
        serwer('zapiszInfoStacji', id, zm).then((w) => {
          S.start.infoStacji = w.info; S.start.grupy = w.grupy;
          zastosujInfoStacji(); rysujUlubioneMenu();
          _pamiec.forEach((v, kk) => { if (kk.startsWith('ramowka')) _pamiec.delete(kk); });
          zamknijArkusz(); toast('Zapisano'); idz('stacja', id, true);
        }).catch((er) => { e.currentTarget.disabled = false; toast(er.message, 5000); });
      } }, 'Zapisz')));
  otworzArkusz(box);
}
