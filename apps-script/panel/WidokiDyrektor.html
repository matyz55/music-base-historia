<script>
'use strict';
// ======================= Biuro muzyczne (plan rozwoju D1, D3–D7, D9–D14, O5, AM5, I6) =======================
// Serwer: Dyrektor.gs. Moja stacja – domyślnie Radio Meteor (playlista z mAirList, D2).

const BIURO = [
  ['notowanie', 'Notowanie'], ['dodania', 'Dodania'], ['zmeczenie', 'Zmęczenie'], ['spotkanie', 'Spotkanie muzyczne'], ['mojaStacja', 'Moja stacja na tle rynku'],
  ['analizaRotacji', 'Analiza rotacji'], ['rotacja', 'Plan rotacji'], ['kwota', 'Kwota polska'], ['separacje', 'Separacje'], ['godzina', 'Budowa godziny'], ['sygnaly', 'Wczesne sygnały'],
  ['eksport', 'Eksport i rozliczenia'], ['poprawki', 'Poprawki dopasowań'], ['ankieta', 'Badanie słuchaczy'],
];
const B = { tab: 'notowanie', start: null };
const nazwaTyg = (pn) => 'tydz. ' + dataPL(pn) + ' – ' + dataPL(dodajDni(pn, 6));
const komStacji = (x) => el('span', { class: 'wiersz', style: { flexWrap: 'nowrap' } }, logo(x.id, 'm'), x.nazwa);
const blB = (box) => (e) => bladW(box, e);

// AM5: Apple Music jednym stuknięciem – wyszukiwanie w Apple Music i lista „do dodania” (w tej przeglądarce)
const APPLE_LISTA = 'mb-apple-do-dodania';
const appleLista = () => { try { return JSON.parse(localStorage.getItem(APPLE_LISTA) || '[]') || []; } catch (e) { return []; } };
function zapiszAppleListe(l) { try { localStorage.setItem(APPLE_LISTA, JSON.stringify(l.slice(0, 500))); } catch (e) { /* bez pamięci */ } }
function appleLink(x) { return 'https:\/\/music.apple.com/pl/search?term=' + encodeURIComponent(x.a + ' ' + x.t); }
function przyciskApple(x) {
  return el('span', { class: 'wiersz', style: { flexWrap: 'nowrap', gap: '2px' } },
    el('a', { class: 'chip', style: { padding: '2px 8px' }, href: appleLink(x), target: '_blank', rel: 'noopener', title: 'Otwórz w Apple Music', 'aria-label': 'Otwórz w Apple Music', onclick: (e) => e.stopPropagation() }, '♪'),
    el('button', { class: 'chip', style: { padding: '2px 8px' }, title: 'Do listy „do dodania w Apple Music”', 'aria-label': 'Dodaj do listy Apple Music', onclick: (e) => {
      e.stopPropagation();
      const l = appleLista();
      if (!l.some((y) => y.k === x.k)) { l.unshift({ k: x.k, a: x.a, t: x.t, zrobione: false }); zapiszAppleListe(l); toast('Dodano do listy Apple Music'); } else toast('Już jest na liście');
    } }, '+'));
}
/** Karta listy „do dodania w Apple Music” (Playlisty i Biuro). */
function kartaAppleListy() {
  const box = el('div');
  const rysuj = () => {
    const l = appleLista();
    box.replaceChildren(l.length ? el('div', {},
      el('div', { style: { display: 'grid', gap: '6px' } }, l.map((x) => el('label', { class: 'wiersz', style: { flexWrap: 'nowrap', gap: '8px', opacity: x.zrobione ? 0.5 : 1 } },
        el('input', { type: 'checkbox', checked: x.zrobione, onchange: (e) => { x.zrobione = e.target.checked; zapiszAppleListe(l); rysuj(); } }),
        przyciskFragmentu(x), el('span', { style: { flex: 1, minWidth: 0 } }, el('b', {}, x.t), ' · ' + x.a),
        el('a', { class: 'chip', href: appleLink(x), target: '_blank', rel: 'noopener' }, 'Apple Music')))),
      el('div', { class: 'wiersz', style: { marginTop: '8px' } },
        el('button', { class: 'przycisk drugi maly', onclick: () => { zapiszAppleListe(l.filter((x) => !x.zrobione)); rysuj(); } }, 'Usuń odhaczone'),
        el('button', { class: 'przycisk drugi maly', onclick: () => { zapiszAppleListe([]); rysuj(); } }, 'Wyczyść')))
      : el('p', { class: 'opis' }, 'Pusta. Przycisk „+” przy utworze (Ranking, Biuro muzyczne) dodaje go tutaj; „♪” otwiera wyszukiwanie w Apple Music.'));
  };
  rysuj();
  return karta('Do dodania w Apple Music', 'Lista w tej przeglądarce: stuknij „Apple Music”, dodaj utwór do biblioteki albo playlisty w aplikacji i odhacz.', box);
}

WIDOKI.biuro = (box, arg) => {
  if (arg && BIURO.some((x) => x[0] === arg)) B.tab = arg;
  const tresc = el('div', {}, szkielet(2));
  const naglowek = el('div', { class: 'naglowek-karty' }, el('h1', {}, 'Biuro muzyczne'));
  const zakl = el('div', { class: 'zakladki', role: 'tablist', style: { flexWrap: 'nowrap', overflowX: 'auto', maxWidth: '100%' } }, BIURO.map(([id, n]) =>
    el('button', { role: 'tab', class: B.tab === id ? 'akt' : '', style: { whiteSpace: 'nowrap', flex: 'none' }, onclick: () => idz('biuro', id) }, n)));
  setTimeout(() => { const a = zakl.querySelector('.akt'); if (a) a.scrollIntoView({ block: 'nearest', inline: 'center' }); }, 0);
  const wyborStacji = el('select', { 'aria-label': 'Moja stacja' }, S.start.jednostki.map((j) => el('option', { value: j.id }, j.nazwa)));
  box.replaceChildren(naglowek, el('div', { class: 'wiersz', style: { margin: '4px 0 10px' } }, el('span', { class: 'sub' }, 'Moja stacja:'), wyborStacji, przyciskZapiszWidok('biuro', B.tab)), zakl, tresc);
  serwerP('biuroStart').then((s) => {
    B.start = s;
    wyborStacji.value = s.mojaStacja;
    wyborStacji.onchange = () => serwer('ustawMojaStacje', wyborStacji.value).then(() => { _pamiec.forEach((v, k) => { if (k.startsWith('biuroStart')) _pamiec.delete(k); }); idz('biuro', B.tab, true); });
    (BIURO_WIDOKI[B.tab] || BIURO_WIDOKI.notowanie)(tresc, s);
  }).catch(blB(tresc));
};

const BIURO_WIDOKI = {};

// ---------------- D4: notowanie (+ I6: odnośniki do list ZPAV) ----------------
BIURO_WIDOKI.notowanie = (box) => {
  const rysuj = (pn, ile, wazone) => {
    box.replaceChildren(...szkielet(1));
    serwerP('notowanie', pn || null, ile || 100).then((r) => {
      const wybor = el('select', { 'aria-label': 'Tydzień' }, r.tygodnie.map((t) => el('option', { value: t }, nazwaTyg(t))));
      wybor.value = r.tydzien;
      const ileS = el('select', { 'aria-label': 'Liczba pozycji' }, [20, 50, 100, 300].map((n) => el('option', { value: n }, 'Top ' + n)));
      ileS.value = r.ile;
      const waga = el('label', { class: 'wiersz' }, el('input', { type: 'checkbox', checked: !!wazone }), ' ważone słuchalnością (Radio Track)');
      wybor.onchange = () => rysuj(wybor.value, +ileS.value, waga.firstChild.checked);
      ileS.onchange = wybor.onchange; waga.firstChild.onchange = wybor.onchange;
      const zm = (x) => (x.poprzednio == null ? el('span', { class: 'zm n' }, 'nowość') : x.poprzednio === x.miejsce ? el('span', { class: 'zm' }, '=') : el('span', { class: 'zm ' + (x.poprzednio > x.miejsce ? 'w' : 's') }, (x.poprzednio > x.miejsce ? '▲ ' : '▼ ') + Math.abs(x.poprzednio - x.miejsce)));
      const kol = [['#', (x) => x.miejsce, 'num'], ['Ruch', zm, null, (x) => (x.poprzednio == null ? 'nowość' : x.poprzednio - x.miejsce)], ['Utwór', utworKomorka, null, (x) => x.a + ' – ' + x.t],
        ['Emisje', (x) => fmt(x.n), 'num', (x) => x.n], ['Przyrost', (x) => (x.nPoprzednio == null ? '–' : el('span', { class: 'zm ' + (x.n >= x.nPoprzednio ? 'w' : 's') }, (x.n >= x.nPoprzednio ? '+' : '') + fmt(x.n - x.nPoprzednio))), 'num', (x) => (x.nPoprzednio == null ? '' : x.n - x.nPoprzednio)],
        ['Tygodni', (x) => fmt(x.tygodni), 'num tylko-szeroki'], ['Najwyżej', (x) => x.najwyzej + '.', 'num tylko-szeroki', (x) => x.najwyzej], ['', przyciskApple, 'num', () => '']];
      const tab = el('div');
      const pokaz = (lista, opis) => tab.replaceChildren(el('p', { class: 'sub', style: { marginBottom: '6px' } }, opis),
        tabela(kol, lista, { klik: (x) => idz('utwor', x.k), nazwaEksportu: 'Notowanie ' + r.tydzien, limit: 50 }));
      pokaz(r.pozycje, `${nazwaTyg(r.tydzien)} · ${fmt(r.utworow)} utworów grało w tym tygodniu. Miejsce wg emisji (remis – to samo miejsce); ruch wobec poprzedniego tygodnia.`);
      if (wazone) {
        // wariant ważony: emisje × udział stacji w czasie słuchania (Radio Track) – z „Wskaźników” za ten tydzień
        serwerP('wskazniki', r.tydzien, dodajDni(r.tydzien, 6)).then((w) => {
          const udz = {}; Object.entries(window.STACJE_DANE || {}).forEach(([id, d]) => { if (d.rynek && d.rynek.udzial) udz[id] = d.rynek.udzial / 100; });
          const l = w.top.map((u) => { let z = 0; Object.entries(u.na).forEach(([j, n]) => { if (udz[j]) z += n * udz[j]; }); return { k: u.k, a: u.a, t: u.t, n: Math.round(z * 10) / 10, poprzednio: null, nPoprzednio: null, tygodni: '', najwyzej: '' }; })
            .filter((u) => u.n > 0).sort((a, b) => b.n - a.n).slice(0, r.ile);
          l.forEach((x, i) => { x.miejsce = i + 1; });
          pokaz(l, 'Wariant ważony: emisje na każdej stacji × udział stacji w czasie słuchania (Radio Track). Bliżej listy OLiA, która też liczy słuchaczy, a nie emisje. 300 najczęściej granych utworów tygodnia.');
        }).catch(blB(tab));
      }
      box.replaceChildren(el('div', { class: 'wiersz', style: { marginBottom: '8px' } }, wybor, ileS, waga),
        karta('Notowanie airplay – całe radio', null, tab),
        karta('Oficjalne listy ZPAV (I6)', 'OLiA (airplay ważony słuchalnością) i OLiS (sprzedaż i streaming) publikuje ZPAV. Porównaj ręcznie z naszym notowaniem – nie pobieramy ich automatycznie.',
          el('div', { class: 'wiersz' }, el('a', { class: 'chip', href: 'https:\/\/olis.pl/', target: '_blank', rel: 'noopener' }, 'olis.pl – listy OLiS i OLiA'),
            el('a', { class: 'chip', href: 'https:\/\/en.wikipedia.org/wiki/Polish_music_charts', target: '_blank', rel: 'noopener' }, 'Opis list (Wikipedia)'))));
    }).catch(blB(box));
  };
  rysuj();
};

// ---------------- D3: dodania tygodnia ----------------
BIURO_WIDOKI.dodania = (box) => {
  const rysuj = (pn) => serwerP('dodaniaTygodnia', pn || null).then((r) => {
    const wybor = el('select', { 'aria-label': 'Tydzień' }, r.tygodnie.map((t) => el('option', { value: t }, nazwaTyg(t))));
    wybor.value = r.tydzien; wybor.onchange = () => rysuj(wybor.value);
    box.replaceChildren(el('div', { class: 'wiersz', style: { marginBottom: '8px' } }, wybor),
      karta('Najczęściej dodawane („Most Added”)', `${nazwaTyg(r.tydzien)}: ${fmt(r.dodan)} utworów zagranych pierwszy raz na co najmniej jednej stacji. Kolejność: ile stacji dodało utwór w tym tygodniu.`,
        tabela([['#', (x, i) => i + 1, 'num'], ['Utwór', utworKomorka, null, (x) => x.a + ' – ' + x.t], ['Stacji', (x) => fmt(x.stacji), 'num', (x) => x.stacji],
          ['Pierwsza', (x) => el('span', { class: 'wiersz', style: { flexWrap: 'nowrap', gap: '6px' } }, logo(x.kto[0].id, 'm'), el('span', { class: 'sub' }, dataPL(x.kto[0].d, false))), null, (x) => x.kto[0].nazwa],
          ['Kto dodał', (x) => el('span', { class: 'sub' }, x.kto.map((p) => p.nazwa + ' ' + dataPL(p.d, false)).join(', ')), 'tylko-szeroki', (x) => x.kto.map((p) => p.nazwa + ' ' + p.d).join('; ')],
          ['', przyciskApple, 'num', () => '']], r.u, { klik: (x) => idz('utwor', x.k), nazwaEksportu: 'Dodania ' + r.tydzien, limit: 30 })),
      karta('Ile dodała każda stacja', 'Liczba utworów zagranych pierwszy raz w tym tygodniu (pierwsze 4 tygodnie danych stacji pomijamy).',
        tabela([['Stacja', komStacji, null, (x) => x.nazwa], ['Dodań', (x) => fmt(x.n), 'num', (x) => x.n]], r.stacje, { klik: (x) => idz('stacja', x.id), nazwaEksportu: 'Dodania stacji ' + r.tydzien, limit: 15 })));
  }).catch(blB(box));
  rysuj();
};

// ---------------- D7: zmęczenie ----------------
BIURO_WIDOKI.zmeczenie = (box) => serwerP('zmeczenieRynku').then((r) => {
  const l = r.u.slice().sort((a, b) => (a.odSzczytu == null) - (b.odSzczytu == null) || a.odSzczytu - b.odSzczytu);
  box.replaceChildren(karta('Zmęczenie utworem na rynku', `300 najczęściej granych w tygodniu od ${dataPL(r.tydzien)}. „Od szczytu” = emisje teraz wobec najlepszego tygodnia (26 tygodni); „Wcześni gracze” = ostatni pełny miesiąc wobec najlepszego miesiąca u 3 stacji, które zagrały utwór najwcześniej. To sygnał do decyzji, nie badanie słuchaczy.`,
    tabela([['Utwór', utworKomorka, null, (x) => x.a + ' – ' + x.t], ['Emisje', (x) => fmt(x.n), 'num', (x) => x.n], ['Od szczytu', (x) => (x.odSzczytu == null ? '–' : proc(x.odSzczytu)), 'num', (x) => x.odSzczytu],
      ['Trend 4 tyg.', (x) => (x.trend4 == null ? '–' : el('span', { class: 'zm ' + (x.trend4 >= 0 ? 'w' : 's') }, (x.trend4 >= 0 ? '+' : '') + proc(x.trend4))), 'num', (x) => x.trend4],
      ['Tygodni', (x) => fmt(x.tygodni), 'num tylko-szeroki'], ['Wcześni gracze', (x) => (x.wczesniSpadek == null ? '–' : proc(x.wczesniSpadek)), 'num tylko-szeroki', (x) => x.wczesniSpadek],
      ['26 tyg.', (x) => iskierka(x.seria.map((v) => Math.max(0, v)), 80, 20), 'tylko-szeroki', () => '']], l, { klik: (x) => idz('utwor', x.k), nazwaEksportu: 'Zmęczenie ' + r.tydzien, limit: 40 })));
}).catch(blB(box));

// ---------------- D5: spotkanie muzyczne ----------------
BIURO_WIDOKI.spotkanie = (box, s) => serwerP('kandydaciSpotkania', s.mojaStacja).then((r) => {
  const decyduj = (x, stan, wiersz) => {
    const notatka = stan === 'usun' ? '' : (prompt('Notatka (opcjonalnie):', (x.decyzja && x.decyzja.notatka) || '') || '');
    serwer('zapiszDecyzje', x.k, stan, notatka, { a: x.a, t: x.t }).then(() => { toast(stan === 'dodaj' ? 'Dodaj – zapisane' : stan === 'odrzuc' ? 'Odrzucone' : 'Wróci za tydzień'); wiersz.remove(); _pamiec.forEach((v, k) => { if (k.startsWith('kandydaciSpotkania')) _pamiec.delete(k); }); })
      .catch((e) => toast(e.message));
  };
  const karty = r.kandydaci.map((x) => {
    const w = el('div', { class: 'karta', style: { padding: '12px' } },
      el('div', { class: 'wiersz', style: { justifyContent: 'space-between' } }, utworKomorka(x)),
      el('p', { class: 'sub', style: { margin: '6px 0' } }, [x.powody.join(' · '), x.l ? 'czas ' + Math.floor(x.l / 60) + ':' + String(Math.round(x.l % 60)).padStart(2, '0') : null, x.bpm ? Math.round(x.bpm) + ' BPM' : null, x.y ? 'rok ' + x.y : null, fmt(x.n) + ' emisji w bazie'].filter(Boolean).join(' · ')),
      x.stacje.length ? el('p', { class: 'sub' }, 'Grają: ' + x.stacje.slice(0, 8).map((p) => p.nazwa + ' (od ' + dataPL(p.od, false) + ')').join(', ') + (x.stacje.length > 8 ? '…' : '')) : null,
      el('div', { class: 'wiersz', style: { marginTop: '8px' } }));
    w.lastChild.append(el('button', { class: 'przycisk maly', onclick: () => decyduj(x, 'dodaj', w) }, 'Dodaj'), el('button', { class: 'przycisk drugi maly', onclick: () => decyduj(x, 'odrzuc', w) }, 'Odrzuć'),
      el('button', { class: 'przycisk drugi maly', onclick: () => decyduj(x, 'wroc', w) }, 'Wróć za tydzień'), el('button', { class: 'przycisk drugi maly', onclick: () => idz('utwor', x.k) }, 'Profil'), przyciskApple(x));
    return w;
  });
  box.replaceChildren(karta('Kandydaci do dodania – ' + r.nazwa, `Utwory, których stacja jeszcze nie grała: debiuty na ≥ 3 stacjach (30 dni), polskie nowości (90 dni), utwory rosnące na stacjach o podobnym formacie (${r.podobne.join(', ') || 'brak danych'}). Decyzje „Dodaj” i „Odrzuć” chowają utwór; „Wróć za tydzień” – na 7 dni.`,
    karty.length ? el('div', { style: { display: 'grid', gap: '8px' } }, karty) : el('p', { class: 'opis' }, 'Brak kandydatów.')),
  karta('Historia decyzji', null, tabela([['Kiedy', (x) => new Date(x.kiedy).toLocaleDateString('pl-PL'), 'num'], ['Utwór', (x) => (x.a && x.t ? utworKomorka(x) : (x.a || '') + ' – ' + (x.t || x.k)), null, (x) => (x.a || '') + ' – ' + (x.t || x.k)], ['Decyzja', (x) => ({ dodaj: 'dodaj', odrzuc: 'odrzuć', wroc: 'wróć', usun: 'cofnięta' })[x.stan] || x.stan], ['Notatka', (x) => x.notatka || '', 'tylko-szeroki']],
    r.historia, { nazwaEksportu: 'Decyzje spotkań', limit: 20, pusta: 'Jeszcze nie ma decyzji.' })), kartaAppleListy());
}).catch(blB(box));

// ---------------- D1: moja stacja na tle rynku ----------------
BIURO_WIDOKI.mojaStacja = (box, s) => {
  const rysuj = () => serwerP('mojaStacjaNaTle', s.mojaStacja, S.od, S.do).then((r) => {
    box.replaceChildren(pasekFiltrow(rysuj, { stacje: false }),
      kafle([['Udział polskich', proc(r.udzialPL), 'rynek: ' + proc(r.udzialPLrynek)], ['Nowości u nas', r.nowosciMediana == null ? '–' : fmt(r.nowosciMediana) + ' dni', 'mediana od pierwszej emisji w bazie; rynek: ' + (r.nowosciRynekMediana == null ? '–' : fmt(r.nowosciRynekMediana) + ' dni')],
        ['Miejsce w szybkości', r.nowosciMiejsce ? r.nowosciMiejsce + ' z ' + r.nowosciStacji : '–', 'wśród stacji z ≥ 10 debiutami'], ['Rotacja top 20', proc(r.rotacjaTop20), fmt(r.utworow) + ' utworów, ' + fmt(r.emisji) + ' emisji']]),
      karta('Luki: grane szeroko, u nas nie', `${dataPL(r.od)} – ${dataPL(r.do)} · utwory grane na ≥ 5 innych stacjach, których ${r.nazwa} nie zagrało.`,
        tabela([['Utwór', utworKomorka, null, (x) => x.a + ' – ' + x.t], ['Emisji na rynku', (x) => fmt(x.n), 'num', (x) => x.n], ['Stacji', (x) => fmt(x.stacji), 'num'], ['', przyciskApple, 'num', () => '']], r.luki, { klik: (x) => idz('utwor', x.k), nazwaEksportu: 'Luki ' + r.nazwa, limit: 25 })),
      karta('Grane tylko u nas', 'Utwory, których w tym okresie nie zagrała żadna inna stacja w bazie.',
        tabela([['Utwór', utworKomorka, null, (x) => x.a + ' – ' + x.t], ['Emisji', (x) => fmt(x.n), 'num', (x) => x.n]], r.tylkoU, { klik: (x) => idz('utwor', x.k), nazwaEksportu: 'Tylko u nas ' + r.nazwa, limit: 25 })));
  }).catch(blB(box));
  rysuj();
};

// ---------------- D6: plan rotacji ----------------
BIURO_WIDOKI.rotacja = (box, s) => serwerP('kontrolaRotacji', s.mojaStacja).then((r) => {
  const plan = s.rotacja;
  const zapisz = () => serwer('zapiszPlanRotacji', s.mojaStacja, plan).then(() => { toast('Zapisano plan'); _pamiec.clear(); idz('biuro', 'rotacja', true); }).catch((e) => toast(e.message));
  const katSel = (x) => {
    const sel = el('select', { 'aria-label': 'Kategoria', onclick: (e) => e.stopPropagation() }, [el('option', { value: '' }, '–')].concat(plan.kategorie.map((k) => el('option', { value: k.id }, k.nazwa))));
    sel.value = plan.utwory[x.k] || '';
    sel.onchange = () => { if (sel.value) plan.utwory[x.k] = sel.value; else delete plan.utwory[x.k]; zapisz(); };
    return sel;
  };
  const kategorie = el('div', { style: { display: 'grid', gap: '6px' } }, plan.kategorie.map((k) => el('div', { class: 'wiersz', style: { gap: '6px' } },
    el('input', { value: k.nazwa, style: { width: '120px' }, 'aria-label': 'Nazwa kategorii', onchange: (e) => { k.nazwa = e.target.value; } }),
    el('span', { class: 'sub' }, 'emisji/tydz.'), el('input', { type: 'number', value: k.cel, style: { width: '64px' }, onchange: (e) => { k.cel = +e.target.value; } }),
    el('span', { class: 'sub' }, 'min. odstęp (h)'), el('input', { type: 'number', value: k.odstepH, style: { width: '64px' }, onchange: (e) => { k.odstepH = +e.target.value; } }))));
  box.replaceChildren(
    karta('Kategorie ' + r.nazwa, 'Własne kategorie i cele. Kategorię utworu ustawisz w tabelach niżej.', kategorie, el('button', { class: 'przycisk maly', style: { marginTop: '8px' }, onclick: zapisz }, 'Zapisz kategorie')),

}

    lista.forEach((x) => {
      if (x.propozycja === 'zdjac') delete plan.utwory[x.k];

        if (!plan.kategorie.some((c) => c.id === x.propozycja) && NOWA_KAT[x.propozycja]) plan.kategorie.push(NOWA_KAT[x.propozycja]);
        plan.utwory[x.k] = x.propozycja;
      }
    });
    return serwer('zapiszPlanRotacji', s.mojaStacja, plan).then(() => { toast(lista.length === 1 ? 'Zapisano w planie rotacji' : `Zapisano ${lista.length} zmian w planie rotacji`); _pamiec.clear(); idz('biuro', 'analizaRotacji', true); }).catch((e) => toast(e.message));
  };

      (r.planUstawiony ? `Kategorie z Twojego planu rotacji (${fmt(r.planUstawiony)} utworów); pozostałe utwory – kategoria wyliczona z liczby emisji.` : 'Plan rotacji jest pusty – kategorie wyliczone z liczby emisji (cele z zakładki Plan rotacji). „Przenieś” zapisuje utwór w planie.'),
      el('div', { class: 'wiersz', style: { gap: '14px' } }, liczniki)),
    karta(`Propozycje przeniesień (${fmt(r.propozycje.length)})`, 'Heurystyka Music Base: Power → Current, gdy rynek zmęczony; Current → Power, gdy utwór jest w top ' + r.reguly.topPower + ' notowania i rośnie; Current → Recurrent po szczycie; Nowość → Current, gdy przyjął się na rynku; stare utwory → Gold. Decyzja zawsze należy do Ciebie.',
      r.propozycje.length ? el('div', { class: 'wiersz', style: { marginBottom: '8px' } }, el('button', { class: 'przycisk maly', onclick: () => { if (confirm(`Zapisać w planie wszystkie ${r.propozycje.length} propozycje?`)) przenies(r.propozycje); } }, 'Przenieś wszystkie')) : null,

    przyciskFragmentu(x), el('span', { style: { flex: 1, minWidth: 0 } }, (i + 1) + '. ', el('b', {}, x.t), ' · ' + x.a),
    el('button', { class: 'przycisk drugi maly', onclick: () => { wybrane.splice(i, 1); rysujWybrane(); } }, 'Usuń'))) : [el('p', { class: 'stan' }, 'Brak utworów – dodaj z wyszukiwarki albo z notowania (do 20).')]));
  const dodaj = (x) => { if (wybrane.length >= 20) return toast('Najwyżej 20 utworów'); if (!wybrane.some((y) => y.k === x.k)) wybrane.push({ k: x.k, a: x.a, t: x.t }); rysujWybrane(); };
  const q = el('input', { type: 'search', placeholder: 'szukaj utworu…', style: { flex: 1, minWidth: '10em' } });
  const szukajU = () => serwer('szukaj', q.value).then((w) => wyniki.replaceChildren(...((w && w.wyniki) || []).slice(0, 10).map((x) => el('button', { class: 'chip', style: { margin: '2px' }, onclick: () => dodaj(x) }, '+ ' + x.t + ' · ' + x.a)))).catch((e) => toast(e.message));
  q.addEventListener('keydown', (e) => { if (e.key === 'Enter') szukajU(); });
  const zNotowania = () => serwer('notowanie', null, 15).then((w) => { (w.pozycje || []).slice(0, 15).forEach(dodaj); }).catch((e) => toast(e.message));
  const utworz = () => serwer('zapiszAnkiete', { tytul: tytul.value, opis: opis.value, od: od.value, klucze: wybrane.map((x) => x.k) }).then((a) => {
    if (a.blad) return toast(a.blad);
    toast('Ankieta utworzona'); _pamiec.clear(); idz('biuro', 'ankieta', true);
  }).catch((e) => toast(e.message));
  rysujWybrane();
  const kopiuj = (t) => { try { navigator.clipboard.writeText(t); toast('Skopiowano odnośnik'); } catch (e) { toast(t); } };
  box.replaceChildren(
    karta('Nowa ankieta', 'Słuchacze oceniają utwory: czy znają, jak bardzo lubią (1–5), czy mają dość. Strona ankiety działa bez logowania (serwuje ją Odbiornik); przy utworach z teledyskiem w YouTube pokazujemy odtwarzacz YouTube. Odpowiedzi są anonimowe.',
      el('div', { style: { display: 'grid', gap: '6px' } }, tytul, opis, el('div', { class: 'wiersz' }, q, el('button', { class: 'przycisk drugi', onclick: szukajU }, 'Szukaj'), el('button', { class: 'przycisk drugi', onclick: zNotowania }, 'Top 15 notowania')), wyniki, lista,
        el('div', { class: 'wiersz' }, od, el('button', { class: 'przycisk', onclick: utworz }, 'Utwórz ankietę')))),
    karta('Ankiety', d.adresZnany ? null : 'Odnośniki pojawią się po najbliższym przeliczaniu (Odbiornik zapisuje swój adres w kroku „ankiety”).',
      tabela([['Tytuł', (x) => x.tytul], ['Utworów', (x) => fmt(x.utworow), 'num'], ['Odpowiedzi', (x) => fmt(x.odpowiedzi), 'num'], ['Stan', (x) => x.aktywna ? 'otwarta' : 'zamknięta'],
        ['', (x) => el('span', { class: 'wiersz', style: { flexWrap: 'nowrap', gap: '4px' } },
          x.adres ? el('button', { class: 'przycisk drugi maly', onclick: (e) => { e.stopPropagation(); kopiuj(x.adres); } }, 'Odnośnik') : '',
          el('button', { class: 'przycisk drugi maly', onclick: (e) => { e.stopPropagation(); serwer('zamknijAnkiete', x.id, !x.aktywna).then(() => { _pamiec.clear(); idz('biuro', 'ankieta', true); }); } }, x.aktywna ? 'Zamknij' : 'Otwórz')), 'num']],
      d.ankiety, { pusta: 'Brak ankiet.', klik: (x) => pokazWyniki(x.id) })),
    el('div', { id: 'ankietaWyniki' }));
  const pokazWyniki = (id) => serwer('wynikiAnkiety', id).then((w) => {
    if (w.blad) return toast(w.blad);
    const cel = document.getElementById('ankietaWyniki');
    cel.replaceChildren(karta('Wyniki: ' + w.tytul, `${fmt(w.odpowiedzi)} odpowiedzi` + (w.czekaNaScalenie ? `, ${fmt(w.czekaNaScalenie)} czeka na scalenie (przy najbliższym przeliczaniu)` : '') + '. Wskaźnik = % ocen 4–5 minus % „mam dość” wśród znających (definicja Music Base). Przy małej liczbie odpowiedzi różnice mogą być przypadkowe.',
      tabela([['Utwór', utworKomorka, null, (x) => x.a + ' – ' + x.t], ['Znajomość', (x) => x.znajomosc == null ? '–' : fmt(x.znajomosc, 1) + '%', 'num'], ['Sympatia', (x) => x.sympatia == null ? '–' : fmt(x.sympatia, 2), 'num'],
        ['4–5', (x) => x.pozytywne == null ? '–' : fmt(x.pozytywne, 1) + '%', 'num'], ['Mam dość', (x) => x.zmeczenie == null ? '–' : fmt(x.zmeczenie, 1) + '%', 'num'], ['Wskaźnik', (x) => x.wskaznik == null ? '–' : fmt(x.wskaznik, 1), 'num'], ['Ocen', (x) => fmt(x.ocen), 'num']],
      w.utwory.slice().sort((a, b) => (b.wskaznik ?? -999) - (a.wskaznik ?? -999)), { pusta: 'Brak utworów.' })));
    cel.scrollIntoView({ behavior: 'smooth' });
  }).catch((e) => toast(e.message));
}).catch(blB(box));
</script>
