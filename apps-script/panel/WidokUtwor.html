/** Surowe emisje {m: {stacja: ["DD GG:MM"]}} → lista emisji jednostek bez powtórzeń w sieciach. */
function emisjeJednostek(surowe) {

    if (e.j !== e.s) {   // stacja w sieci: ta sama piosenka w ciągu 3 min na innej stacji sieci = wspólne pasmo

    el('div', { class: 'emisje-lista' }, mies[mm].map((e) => el('span', {}, +e.c.slice(8, 10) + '.' + e.c.slice(5, 7) + ' ' + e.c.slice(11))))));
}

// ---------------- tekst (lrclib.net, w przeglądarce) ----------------
function pokazTekst(box, p) {
  box.replaceChildren(...szkielet(1));
  const a = p.a.split(/\s+(?:\/|&|feat\.?|ft\.?|x)\s+/i)[0];
  fetch('https:\/\/lrclib.net/api/search?' + new URLSearchParams({ artist_name: a, track_name: p.t }))
    .then((r) => (r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status))))
    .then((w) => {
      const t = (w || []).find((x) => x.plainLyrics) || (w || []).find((x) => x.instrumental);
      if (!t) { box.replaceChildren(el('p', { class: 'opis' }, 'lrclib.net nie ma tekstu tego utworu.')); return; }
      if (t.instrumental) { box.replaceChildren(el('p', { class: 'opis' }, 'Utwór instrumentalny (wg lrclib.net).')); return; }
      // podświetlanie słów do ocenzurowania przed emisją (lista heurystyczna – decyzja należy do redakcji)
      const o = Wulg.oznacz(t.plainLyrics), pre = el('pre', { class: 'tekst-piosenki' }, o.czesci);
      const lista = (slowa) => Object.entries(slowa).sort((a, b) => b[1] - a[1]).map(([w, n]) => w + (n > 1 ? ' ×' + n : '')).join(', ');
      const opis = el('div', { class: 'wulg-opis', hidden: true },
        o.w2 ? el('p', {}, el('span', { class: 'wulg w2' }, 'Do ocenzurowania'), ` ${o.w2} (${lista(o.slowa2)})`) : null,
        o.w1 ? el('p', {}, el('span', { class: 'wulg w1' }, 'Do rozważenia'), ` ${o.w1} (${lista(o.slowa1)})`) : null,
        el('p', { class: 'sub' }, o.w2 || o.w1 ? `W ${o.wierszy} ${o.wierszy === 1 ? 'wierszu' : 'wierszach'}. ` : 'Nie znaleziono słów z listy. ',
          'Lista słów jest heurystyczna (polskie i angielskie, z odmianą) – przed emisją sprawdź tekst i wersję radiową utworu.'));
      const przycisk = el('button', { class: 'przycisk drugi maly', 'aria-pressed': 'false', onclick: () => {
        const wl = !pre.classList.contains('pokaz-wulg');
        pre.classList.toggle('pokaz-wulg', wl); opis.hidden = !wl; przycisk.setAttribute('aria-pressed', String(wl));
        przycisk.textContent = wl ? 'Ukryj podświetlenie' : 'Podświetl wulgaryzmy' + (o.w2 + o.w1 ? ` (${o.w2 + o.w1})` : '');
        const pierwszy = wl && pre.querySelector('.wulg'); if (pierwszy) pierwszy.scrollIntoView({ block: 'center', behavior: 'smooth' });
      } }, 'Podświetl wulgaryzmy' + (o.w2 + o.w1 ? ` (${o.w2 + o.w1})` : ''));
      box.replaceChildren(el('p', { class: 'sub' }, 'Dopasowanie: ' + t.artistName + ' – ' + t.trackName + (t.albumName ? ' (' + t.albumName + ')' : '')),
        el('div', { class: 'wiersz', style: { margin: '6px 0' } }, przycisk, o.w2 ? znacznikWulg(2) : o.w1 ? znacznikWulg(1) : null), opis, pre);
    }).catch((e) => box.replaceChildren(el('p', { class: 'blad' }, 'Nie udało się pobrać tekstu z lrclib.net: ' + e.message)));
}

// ---------------- Songster: dane i ciekawostki ----------------
let songsterObietnica = null;
function songster() {
  if (!songsterObietnica) {
    const wczytaj = (src) => new Promise((ok, zle) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => zle(new Error('nie wczytano ' + src)); document.head.append(s); });
    songsterObietnica = Promise.all([wczytaj('https:\/\/matyz55.github.io/songster/songs.js'), wczytaj('https:\/\/matyz55.github.io/songster/facts.js')]).then(() => {
      const idx = {};
      (window.SONGS || []).forEach((s) => {
        const tk = tytulKlucz(s.t);
        [s.a, s.ma, s.ia].concat(s.x || []).filter(Boolean).forEach((n) => wykonawcyKlucz(n).forEach((w) => { if (!idx[w + '|' + tk]) idx[w + '|' + tk] = s; }));
      });
      return idx;
    });
    songsterObietnica.catch(() => { songsterObietnica = null; });
  }
  return songsterObietnica;
}
function pokazCiekawostki(box, p) {
  songster().then((idx) => {
    let s = null;
    wykonawcyKlucz(p.a).some((w) => (s = idx[w + '|' + tytulKlucz(p.t)]));
    if (!s) { box.replaceChildren(el('p', { class: 'opis' }, 'Tego utworu nie ma (jeszcze) w bazie Songstera.')); return; }
    const out = [];
    (s.f || []).forEach((f) => {
      const [c, a, b, d] = f.split(':');
      if (c === 'e') out.push(b === '1' ? `🏆 Zwycięzca Eurowizji ${a}` : (b ? `🎤 Eurowizja ${a}: ${b}. miejsce` : `🎤 Występ na Eurowizji ${a}`) + (d ? ` (${krajNazwa(d)})` : ''));
      else if (c === 'jr') out.push(`🎤 Eurowizja Junior ${a}` + (b ? `: ${b}. miejsce` : ''));
      else if (c === 'ep') out.push(`🎤 Preselekcje do Eurowizji ${a}` + (d ? `: ${d}. miejsce` : ''));
      else if (c === 'w') out.push(`🎬 Zabrzmiała w: „${f.slice(2).replace(/꞉/g, ':')}”`);
      else if (c === 't1') out.push('📻 1. miejsce na Liście Przebojów Programu Trzeciego');
      else if (c === 'tp') out.push('📻 W plebiscycie „Polski Top Wszech Czasów” Trójki');
      else if (c === 'o') out.push(`🎙 Śpiewana na ${a} Krajowym Festiwalu Piosenki Polskiej w Opolu`);
      else if (c === 'b') out.push(b ? `🇺🇸 Billboard Year-End Hot 100 (${a}): ${b}. miejsce` : `🇺🇸 Na liście Billboard Year-End Hot 100 (${a})`);
      else if (c === 'n') out.push(`🇵🇱 Nr 1 na liście przebojów w Polsce (${a})`);
      else if (c === 'a') out.push(`🏆 ${{ oscar: 'Oscar za najlepszą piosenkę filmową', globe: 'Złoty Glob za najlepszą piosenkę', soty: 'Grammy – piosenka roku', roty: 'Grammy – nagranie roku', grammy: 'Nagroda Grammy', ghof: 'W Grammy Hall of Fame', lgrammy: 'Latin Grammy' }[a] || a} (${b}, wg Wikidata)`);
    });
    ((window.SONG_FACTS || {})[s.a + '|' + s.t] || []).forEach(([c, a, b]) => {
      if (c === 'ml') out.push(`🎼 Muzyka i słowa: ${a} (wg Wikidata)`);
      else if (c === 'm' && a && b) out.push(`🎼 Muzyka: ${a} · słowa: ${b} (wg Wikidata)`);
      else if (c === 'm' && a) out.push(`🎼 Muzyka: ${a} (wg Wikidata)`);
      else if (c === 'm' && b) out.push(`✍️ Słowa: ${b} (wg Wikidata)`);
      else if (c === 'w') out.push(`🎬 Zabrzmiała w: „${a}”${b ? ' (' + b + ')' : ''} (wg Wikidata)`);
      else if (c === 'al') out.push(`💿 Z albumu „${a}” (${b}) (wg Wikidata)`);
      else if (c === 'pr') out.push(`🎚 Producent nagrania: ${a} (wg Wikidata)`);
      else if (c === 'bo') out.push(`🔁 Oparta na utworze „${a}”${b ? ' (' + b + ')' : ''} (wg Wikidata)`);
    });
    const glowny = String(s.ma || s.a).split(/ & | feat\. /)[0];
    ((window.ARTIST_FACTS || {})[glowny] || []).forEach(([c, a, b]) => {
      if (c === 'bn') out.push(`🪪 ${glowny} to pseudonim – właściwie: ${a} (wg Wikidata)`);
      else if (c === 'bp') out.push(`📍 ${glowny} – rok i miejsce urodzenia: ${b}, ${a} (wg Wikidata)`);
      else if (c === 'fp') out.push(`📍 Zespół ${glowny} powstał w ${b} (${a}) (wg Wikidata)`);
    });
    box.replaceChildren(
      el('p', { class: 'opis' }, `W grze Songster: rok ${s.y} (${s.src || 'źródło w VERIFICATION.md Songstera'})${s.cc ? ', kraj wykonawcy: ' + krajNazwa(s.cc) : ''}${(s.g || []).length ? ', gatunek: ' + s.g.join(', ') : ''}.`),
      out.length ? el('ul', { class: 'lista-fakt' }, out.map((t) => el('li', {}, t))) : el('p', { class: 'opis' }, 'Songster nie ma o nim dodatkowych ciekawostek.'));
  }).catch(() => box.replaceChildren(el('p', { class: 'opis' }, 'Nie udało się wczytać bazy Songstera (matyz55.github.io).')));
}
