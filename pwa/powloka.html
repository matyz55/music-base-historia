<style>
/* PWA: stan danych (pasek u góry ekranu, nad treścią) */
#pwa-stan { position: fixed; z-index: 90; left: 50%; transform: translateX(-50%); top: calc(8px + env(safe-area-inset-top, 0px)); max-width: min(560px, calc(100vw - 24px));
  background: var(--karta, #fff); color: var(--tekst2, #333); border: 1px solid var(--linia, #ddd); border-radius: 999px; padding: 6px 14px; font: 500 13px/1.3 system-ui, sans-serif;
  box-shadow: 0 6px 20px rgba(0,0,0,.12); display: flex; gap: 8px; align-items: center; }
#pwa-stan[hidden] { display: none; }
#pwa-stan .pasek { width: 90px; height: 6px; border-radius: 3px; background: var(--siatka, #eee); overflow: hidden; flex: none; }
#pwa-stan .pasek i { display: block; height: 100%; background: var(--akcent, #2563d6); width: 0; transition: width .3s; }
#pwa-stan button { border: 0; background: none; color: var(--akcent, #2563d6); font: inherit; cursor: pointer; padding: 0 0 0 4px; }
</style>
<script>
// Music Base PWA: google.script.run → silnik w wątku roboczym (silnik.js) na danych zapisanych na urządzeniu.
(function () {
  var silnik = new Worker('silnik.js'), nr = 0, czeka = {};
  var pole = null, ukryj = null;
  function stan(t, proc, trwale) {
    if (!pole) { pole = document.getElementById('pwa-stan'); if (!pole) return; }
    pole.hidden = false;
    pole.replaceChildren();
    if (proc != null) { var p = document.createElement('span'); p.className = 'pasek'; var i = document.createElement('i'); i.style.width = Math.round(proc * 100) + '%'; p.append(i); pole.append(p); }
    pole.append(document.createTextNode(t));
    var x = document.createElement('button'); x.textContent = '✕'; x.setAttribute('aria-label', 'Ukryj'); x.onclick = function () { pole.hidden = true; }; pole.append(x);
    clearTimeout(ukryj);
    if (!trwale) ukryj = setTimeout(function () { pole.hidden = true; }, 6000);
  }
  window.PWA_STAN = {};
  silnik.onmessage = function (e) {
    var d = e.data;
    if (d.status) {
      var s = d.status; window.PWA_STAN = s;
      var kiedy = s.zbudowano ? ' · dane z ' + s.zbudowano : '';
      if (s.etap === 'pobieranie') stan('Pobieram dane na urządzenie: ' + (s.zrobione / 1e6).toFixed(1) + ' z ' + (s.razem / 1e6).toFixed(1) + ' MB', s.zrobione / Math.max(1, s.razem), true);
      else if (s.etap === 'gotowe') stan('Dane na urządzeniu aktualne' + kiedy);
      else if (s.etap === 'offline') stan((s.powod === 'bez sieci' ? 'Bez połączenia' : 'Nie pobrano nowych danych (' + s.powod + ')') + ' – dane z urządzenia' + kiedy, null, s.powod !== 'bez sieci');
      else if (s.etap === 'blad') stan('Problem z danymi: ' + s.tekst, null, true);
      return;
    }
    var c = czeka[d.id]; delete czeka[d.id];
    if (!c) return;
    if (d.blad != null) { if (c.err) c.err(new Error(d.blad)); } else if (c.ok) c.ok(d.ok);
  };
  silnik.postMessage({ start: true });
  function mk(ok, err) {
    return new Proxy({}, { get: function (_, fn) {
      if (fn === 'withSuccessHandler') return function (f) { return mk(f, err); };
      if (fn === 'withFailureHandler') return function (f) { return mk(ok, f); };
      if (fn === 'withUserObject') return function () { return mk(ok, err); };
      return function () { var id = ++nr; czeka[id] = { ok: ok, err: err }; silnik.postMessage({ id: id, fn: fn, args: Array.prototype.slice.call(arguments) }); };
    } });
  }
  var obsluga = null;
  window.google = { script: {
    run: mk(),
    host: { close: function () {} },
    history: {
      push: function (st, par) { var q = new URLSearchParams(par || {}).toString(); history.pushState(st, '', q ? '?' + q : location.pathname); },

  window.PARAMETRY_PWA = Object.fromEntries(new URLSearchParams(location.search));

  document.addEventListener('DOMContentLoaded', function () { var d = document.createElement('div'); d.id = 'pwa-stan'; d.hidden = true; d.setAttribute('role', 'status'); document.body.append(d); });
})();
</script>
