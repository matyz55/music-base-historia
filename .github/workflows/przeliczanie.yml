# Podsumowania na Dysku (lata, całe radio, indeks utworów) i metadane utworów (Songster, MusicBrainz)
# w trakcie pobierania historii. Repozytorium publiczne – minuty GitHub Actions bez opłat.
# Sekrety: ODBIORNIK_URL, ODBIORNIK_TOKEN.
name: Przeliczanie i metadane
on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  actions: write   # tylko do uruchomienia następnego zadania (workflow_dispatch)
concurrency:
  group: przeliczanie
  cancel-in-progress: false
jobs:
  przeliczanie:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Przelicz podsumowania i uzupełnij metadane
        env:
          ODBIORNIK_URL: ${{ secrets.ODBIORNIK_URL }}
          ODBIORNIK_TOKEN: ${{ secrets.ODBIORNIK_TOKEN }}
        run: |
          if [ -z "$ODBIORNIK_URL" ] || [ -z "$ODBIORNIK_TOKEN" ]; then echo "Brak sekretów – pomijam."; exit 0; fi
          python3 -m scraper.przeliczanie --max-minuty 40 | tee wynik.txt
          python3 -m scraper.metadane --max-minuty 15
      # Harmonogram GitHuba potrafi pominąć uruchomienia na kilka godzin (11.11.2026: 1–2 z ~12), więc
      # gdy praca nie jest skończona, zadanie od razu zleca następne. Repozytorium publiczne – minuty bez opłat.
      - name: Następne zadanie od razu, jeśli zostało coś do zrobienia
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f wynik.txt ] && grep -q "ZOSTALA_PRACA" wynik.txt; then
            gh workflow run przeliczanie.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}" && echo "Zlecono kolejne zadanie."
          else
            echo "Nic nie zostało – kolejne zadanie tylko z harmonogramu."
          fi
